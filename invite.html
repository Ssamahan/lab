<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Accept staff invitation · Laboratory</title>
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/app.css">
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;box-sizing:border-box}
    main{width:min(100%,460px);padding:24px;border:1px solid var(--border);background:var(--surface);box-sizing:border-box}
    label{display:block;margin-top:16px} input{width:100%;box-sizing:border-box;margin-top:6px} button{margin-top:20px}
    [hidden]{display:none!important}
  </style>
</head>
<body>
  <main>
    <h1>Accept staff invitation</h1>
    <p id="status" role="status" aria-live="polite">Checking your invitation…</p>
    <form hidden>
      <label for="password">Choose a password</label>
      <input class="input" id="password" type="password" autocomplete="new-password" minlength="12" required>
      <label for="confirmation">Confirm password</label>
      <input class="input" id="confirmation" type="password" autocomplete="new-password" minlength="12" required>
      <button class="btn primary" type="submit">Set password</button>
    </form>
    <p><a href="./">Return to the laboratory site</a></p>
  </main>
  <script src="assets/js/core/shared.js"></script>
  <script src="assets/js/core/invite-accept.js"></script>
</body>
</html>
