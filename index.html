  <div class="toolbar"><label style="margin:0">Week starting (Monday)</label>

  <div class="wp-wrap"><table class="wp"><thead><tr><td class="corner">Unit / Day</td>
  ${days.map(d=>`<td class="dow-cell" style="padding:4px 10px;min-width:110px">${DOWL[dayOfWeek(d)]} ${fmtDate(d).slice(0,6)}<br><small>${d.slice(0,10)}</small></td>`).join('')}
  </tr></thead><tbody>
  ${UNITS.map(u=>{
    const isNight = u==='Night Shift';
    return `<tr><td class="name-cell" style="position:static; ${isNight?'background:#0B1C3D; color:#C9A84C; font-weight:900':''}">${esc(u)}${u==='Biochemistry'||u==='Serology'?' <span class="hint">(shared)</span>':''}${u==='Hematology'?' <span class="hint">(requisition Mon)</span>':''}${isNight?' <span class="hint" style="color:#C9A84C">(last row)</span>':''}</td>
    ${days.map((d,i)=>{

      }else{

function collectUnitRoster(wk){
  const ro=DB.unitRosters[wk]||{weekStart:wk,assignments:{}};
  document.querySelectorAll('#mod-roster select[data-u]').forEach(sel=>{
    const d=sel.dataset.d; ro.assignments[d]=ro.assignments[d]||{}; ro.assignments[d][sel.dataset.u]=sel.value; });
  DB.unitRosters[wk]=ro;
}
function buildUnitGroups(totalWorkers){
  // totalWorkers = everyone working that day INCLUDING the receptionist.
  // Returns service groups for the NON-reception workers (Beatrice owns Reception).
  //  3   -> Reception | Phleb+Hemato+Parasito | Biochem+Serol+TB
  //  4   -> Reception | Phleb+Hemato | Biochem+Serol | Parasito+TB
  //  5   -> Reception | Phleb+Hemato | Parasito | Biochem | Serol+TB
  //  6   -> Reception | Phleb | Hemato | Parasito | Biochem | Serol+TB
  //  7+  -> Reception | every service one person
  if(totalWorkers<=2) return [['Phlebotomy','Hematology','Parasitology','Biochemistry','Serology','TB/Molecular']];
  if(totalWorkers===3) return [['Phlebotomy','Hematology','Parasitology'],['Biochemistry','Serology','TB/Molecular']];
  if(totalWorkers===4) return [['Phlebotomy','Hematology'],['Biochemistry','Serology'],['Parasitology','TB/Molecular']];
  if(totalWorkers===5) return [['Phlebotomy','Hematology'],['Parasitology'],['Biochemistry'],['Serology','TB/Molecular']];
  if(totalWorkers===6) return [['Phlebotomy'],['Hematology'],['Parasitology'],['Biochemistry'],['Serology','TB/Molecular']];
  return [['Phlebotomy'],['Hematology'],['Parasitology'],['Biochemistry'],['Serology'],['TB/Molecular']];
}
function staffWorkingOn(wk, iso){
  // read the working plan for that month; return names whose code is D/N/DN/H (working)
  const key=iso.slice(0,7);
  const p=(DB.workingPlans[key]||{}).primary;
  if(!p) return null;
  const di=p.dates.indexOf(iso);
  if(di<0) return null;
  return p.staff.filter(r=>{ const c=(r.codes||[])[di]; return c==='D'||c==='DN'||c==='H'; }).map(r=>r.name);
}
function autoAssignUnits(wk,days,ro,body){
  // People on leave this week are excluded; the working plan decides who works each day.
  const weekStart=days[0], weekEnd=days[6];
  const onLeaveNames=(DB.leaves||[]).filter(l=>{
    const st=staffById(l.staffId); if(!st||st.status!=='active') return false;
    return l.from<=weekEnd && l.to>=weekStart && l.status!=='Ended';
  }).map(l=>staffById(l.staffId).name);
  const allActive=activeStaff();
  ro.assignments={};
  days.forEach((d,di)=>{
    const planWorkers=staffWorkingOn(wk,d);
    const avail=planWorkers
      ? allActive.filter(s=>planWorkers.includes(s.name))
      : allActive.filter(s=>!onLeaveNames.includes(s.name));
    const beatrice=avail.find(s=>/Beatrice/i.test(s.name));
    const kelvin=avail.find(s=>/Kelvin/i.test(s.name));
    const kelvinIn = avail.length<=2 ? kelvin : null; // Kelvin only as 3rd person when <=2 staff
    const others=avail.filter(s=>s!==beatrice && s!==kelvin);
    const ass={};
    if(beatrice){
      ass['Reception']=beatrice.name;
      if(avail.length<=4){ ass['Parasitology']=beatrice.name; } // limited staff -> also Parasitology
      // never Phlebotomy & TB - enforced by not adding her to pool
    }
    const used={}; if(beatrice) used[beatrice.name]=true;
    // the staffing rule counts everyone working EXCEPT Kelvin when he is sitting out
    const effTotal = (kelvin && !kelvinIn) ? avail.length-1 : avail.length;
    const groups=buildUnitGroups(effTotal);
    // build a pool ordered so Jean Paul and Dieudonne alternate on the Phlebotomy group
    const jp=others.find(s=>/Jean Paul/i.test(s.name));
    const dd=others.find(s=>/Dieudonne/i.test(s.name));
    let pool=[];
    if(di%2){ if(dd) pool.push(dd); if(jp) pool.push(jp); }
    else { if(jp) pool.push(jp); if(dd) pool.push(dd); }
    others.forEach(s=>{ if(s!==jp&&s!==dd) pool.push(s); });
    groups.forEach(g=>{
      let pick=null;
      for(const cand of pool){ if(used[cand.name]) continue; pick=cand; break; }
      if(!pick){ for(const cand of others){ if(used[cand.name]) continue; pick=cand; break; } }
      if(pick){ used[pick.name]=true; g.forEach(u=>{ ass[u]=pick.name; }); }
    });
    // Kelvin intervention: when two staff available on weekdays day shift, add me on Biochemistry, Serology & TB per manager request
    if(kelvinIn && !used[kelvinIn.name]){
      if(avail.length===2 && !isWeekend(d)){
        // Two staff available on weekdays -> Kelvin intervenes on Biochemistry, Serology & TB (shared room)
        ['Biochemistry','Serology','TB/Molecular'].forEach(u=>{ ass[u]=kelvinIn.name; });
        used[kelvinIn.name]=true;
      }else{
        // When <=2 staff total (weekend or other), fill first open service
        for(const u of ['Biochemistry','Serology','TB/Molecular','Parasitology','Hematology','Phlebotomy']){ if(!ass[u]){ ass[u]=kelvinIn.name; used[kelvinIn.name]=true; break; } }
      }
    }
    // Biochem & Serology stay together when shared
    if(ass['Biochemistry'] && !ass['Serology']) ass['Serology']=ass['Biochemistry'];
    if(ass['Serology'] && !ass['Biochemistry']) ass['Biochemistry']=ass['Serology'];
    // safety: drop anyone on leave
    for(const u of Object.keys(ass)){ if(onLeaveNames.includes(ass[u])) delete ass[u]; }
    ro.assignments[d]=ass;
  });
  DB.unitRosters[wk]=ro; saveDB(); renderUnitRoster(body); toast('Units auto-assigned from working plan');
}

const IMPORT_NAME_MAP={'KELVIN*':'Kelvin SAMAHANI','KELVIN':'Kelvin SAMAHANI','AURELIE':'Aurelie YANSONEYE','PATRICK':'Patrick ISHIMWE','DIANE*':'Diane UWASE','DIANE':'Diane UWASE','BÉATRICE':'Beatrice NGEZEKURE','BEATRICE':'Beatrice NGEZEKURE','FAUSTIN':'Faustin NTAMBARA','DIEUDONNE':'Dieudonne NIYIDUHABYOSE','JEAN PAUL':'Jean Paul NSENGIYUMVA','ELIE':'Elie NIZEYIMANA','SILADJI':'Siladji Issa DUSABE'};
function importGridFromRows(rows,key){
  let hdr=-1;
  for(let i=0;i<Math.min(rows.length,15);i++){ const r=rows[i]; if(r.some(c=>c&&String(c).includes('Dates')&&String(c).includes('Names'))){ hdr=i; break; } }
  if(hdr<0) return null;
  const hdrRow=rows[hdr];
  // day columns: columns with integer values after index 0
  const dayCols=[];
  for(let c=1;c<hdrRow.length;c++){ const v=hdrRow[c]; if(v!==null&&v!==''&&!isNaN(+v)) dayCols.push(c); }
  if(dayCols.length<20) return null;
  const codeMap={'J':'D','D':'D','GJ':'D','JN':'DN','DN':'DN','GN':'N','N':'N','NN':'N','R':'OFF','OFF':'OFF','CO':'AL','AL':'AL','ML':'ML','SL':'SL','CL':'CL','TR':'TR','W':'W','ABS':'ABS','H':'H','O':'OFF'};
  const staff=[];
  for(let i=hdr+1;i<rows.length;i++){
    const r=rows[i]; const raw=(r[0]||'').toString().trim();
    if(!raw||/^(Keys|Prepared|Verified|Approved|Holidays|D:|N:|OFF:|AA:|AL:|DN:|\*)/.test(raw)) continue;
    const name=IMPORT_NAME_MAP[raw.toUpperCase().replace(/\s+/g,' ').trim()]||raw;
    const codes=dayCols.map(c=>{ const v=(r[c]||'').toString().trim().toUpperCase(); return codeMap[v]||''; });
    staff.push({name, codes}); }
  if(!staff.length) return null;
  const [y,m]=key.split('-'); const first=new Date(y, +m-1, 1);
  const dates=dayCols.map((_,i)=>{ const d=new Date(first); d.setDate(d.getDate()+i); return d.toISOString().slice(0,10); });
  return {staff,dates};
}

/* ================= WORKING PLAN GENERATOR (pure, testable) =================
   Rules implemented:
   • Every day MUST have night coverage AND day coverage — never left blank.
   • Nights come in blocks of 2 or 3 (never a single night when avoidable).
   • After a night block → OFF for the same number of days (blank if it lands on a weekend, to keep weekends clean).
   • Weekends → at most 2 people (1 day + 1 night); allowed 3rd only when fewer than 3 staff available.
   • Weekend day worker gets 2 compensating OFF days on weekdays with 4+ staff on duty.
   • Off-day wishes: night block ends right before the wished date so the OFF lands exactly on it.
   • Holidays: 1 fair day-duty person marked H + night coverage kept; the rest rest.
   • Fairness: night & day balances from previous months steer the picks.
   • Leaves (AL/ML/SL/CL/TR/W) and absences block the staff for those days.
*/
'use strict';
function planDatesForKey(key){
  const [y,m]=key.split('-'); const d=new Date(+y,+m-1,1); const out=[];
  while(d.getMonth()===(+m-1)){ out.push(d.toISOString().slice(0,10)); d.setDate(d.getDate()+1); }
  while(d.getDate()<=7){ out.push(d.toISOString().slice(0,10)); d.setDate(d.getDate()+1); }
  return out; }
function isWknd(iso){ const d=new Date(iso+'T12:00:00').getDay(); return d===0||d===6; }
function computePlan(input){
  const {staff, leaves, absences, offWishes, holidays, key, history, nightPer} = input;
  // Ruli-specific night counters for fairness
  const nightBlockCount = {};
  staff.forEach(s=>nightBlockCount[s.id]=0);

  const dates=planDatesForKey(key);
  const D=dates.length, N=staff.length;
  const codes=staff.map(()=>new Array(D).fill(''));
  const avail=staff.map(()=>new Array(D).fill(true));
  const hset={}; (holidays||[]).forEach(h=>{ hset[h.date]=h.name; });
  const isHol=iso=>hset[iso];
  // leaves
  (leaves||[]).forEach(l=>{ const si=staff.findIndex(s=>s.id===l.staffId); if(si<0) return;
    const LMap={AL:'AL',ML:'ML',SL:'SL',CL:'CL',TR:'TR',W:'W',ABS:'ABS'};
    const code=LMap[l.type]||'AL';
    dates.forEach((iso,di)=>{ if(iso>=l.from&&iso<=l.to){ codes[si][di]=code; avail[si][di]=false; } }); });
  (absences||[]).forEach(a=>{ const si=staff.findIndex(s=>s.id===a.staffId); if(si<0) return;
    const di=dates.indexOf(a.date); if(di>=0){ codes[si][di]='ABS'; avail[si][di]=false; } });
  // balances from history + preferences
  const nightBal={}, dayBal={}, lastNight={}, nightNow={}, restUntil={};
  staff.forEach(s=>{ nightBal[s.id]=history&&history.nightCount&&history.nightCount[s.id]||0;
    dayBal[s.id]=history&&history.dayCount&&history.dayCount[s.id]||0; lastNight[s.id]=-99; nightNow[s.id]=0; restUntil[s.id]=-1; });
  const monthStart=key+'-01';
  const nightOK=si=>{ const st=staff[si]; if(st.nightPref==='no') return false; if(st.maxNights!=null&&st.maxNights<=0) return false; if(st.joinDate&&daysBetween(st.joinDate,monthStart)<30) return false; return true; };
  const isManager=si=>staff[si].pattern==='manager';
  const assignedN=new Array(D).fill(false);
  const dayCovered=new Array(D).fill(false);
  const alerts=[];

  /* Weekend-duty pre-pass: Aurelie covers Sat/Sun DN when available.
     If Aurelie on AL, weekend split: one staff Sat&Sun days, another Sat&Sun nights */
  const aurelieIdx = staff.findIndex(s=>/YANSONEYE/.test(s.name));
  const isAurelieOnAL = (di)=>{
    if(aurelieIdx<0) return false;
    return !avail[aurelieIdx][di] || codes[aurelieIdx][di]==='AL';
  };

  for(let si=0; si<N; si++){
    const pat=staff[si].weekendPattern;
    if(!pat||pat==='none') continue;
    for(let di=0; di<D; di++){
      const iso=dates[di];
      if(!isWknd(iso)) continue;
      if(!avail[si][di]||codes[si][di]||isManager(si)) continue;
      // If Aurelie is the weekend worker but on AL, skip - handled in weekend split below
      if(si===aurelieIdx && isAurelieOnAL(di)) continue;
      const want=pat==='D'?'D':pat==='N'?'N':'DN';
      if(want==='N'){ assignedN[di]=true; codes[si][di]='N'; }
      else if(want==='D'){ if(!dayCovered[di]){ codes[si][di]='D'; dayCovered[di]=true; } }
      else { codes[si][di]='DN'; assignedN[di]=true; dayCovered[di]=true; }
    }
  }

  /* Weekend-only staff (Aurelie) rests Mon-Fri */
  for(let si=0; si<N; si++){
    if(!staff[si].weekendOnly) continue;
    for(let di=0; di<D; di++){
      if(isWknd(dates[di])) continue;
      if(avail[si][di] && !codes[si][di]) codes[si][di]='OFF';
    }
  }

  /* Beatrice never weekends - like manager, and no OFF in weekends to keep clean */
  for(let si=0; si<N; si++){
    if(!/NGEZEKURE/.test(staff[si].name)) continue;
    for(let di=0; di<D; di++){
      if(!isWknd(dates[di])) continue;
      if(avail[si][di] && !codes[si][di]) codes[si][di]=''; // blank, not OFF, to keep weekends clean
    }
  }

  /* ---------- NIGHT PASS ---------- */
  for(let di=0; di<D; di++){
    if(assignedN[di]) continue;
    const date=dates[di];
    let cands=[];
    for(let si=0; si<N; si++){
      if(!avail[si][di] || codes[si][di]) continue;
      if(!nightOK(si)) continue;
      if(di>0 && codes[si][di-1]==='N') continue; // already in a block
      if(di < restUntil[si]) continue; // still in post-night rest window
      cands.push(si); }
    if(!cands.length){ alerts.push('No night cover on '+date); continue; }
    // can this candidate do a 2+ block?
    const canBlock=si=>{ for(let k=0;k<2;k++){ const d2=di+k; if(d2>=D) return false; if(assignedN[d2]) return false; if(!avail[si][d2]||codes[si][d2]) return false; } return true; };
    // Track last triple assignee for alternation Mon-Wed / Thu-Fri
    if(!window._lastTriple) window._lastTriple = null;
    cands.sort((a,b)=>{
      const ba=canBlock(b)?0:1, bb=canBlock(a)?0:1; if(ba!==bb) return bb-ba;
      const isPat = (id)=> /ISHIMWE/.test(staff[id].name);
      const isJP = (id)=> /NSENGIYUMVA/.test(staff[id].name);
      const isDieu = (id)=> /NIYIDUHABYOSE/.test(staff[id].name);
      const isDiane = (id)=> /UWASE/.test(staff[id].name);
      const wd = new Date(dates[di]+'T12:00:00').getDay(); // 0 Sun ..6 Sat, Mon=1
      const score = (idx)=>{
        let sc = nightBal[staff[idx].id]*10 + nightNow[staff[idx].id]*10 + nightBlockCount[staff[idx].id]*3;
        // Patrick: triple lover, prefers Mon-Wed / Wed-Fri starts
        if(isPat(idx)){ sc -= 8; if(nightBlockCount[staff[idx].id]<3) sc -= 40; if(wd===1||wd===3) sc -= 14; }
        // Jean Paul & Dieudonne: alternate Mon-Wed vs Thu-Fri after shortage
        if(isJP(idx) || isDieu(idx)){
          sc -= 6;
          // Alternate: if last triple was JP, prefer Dieu, and vice versa
          if(window._lastTriple && /NSENGIYUMVA/.test(window._lastTriple) && isDieu(idx)) sc -= 20;
          if(window._lastTriple && /NIYIDUHABYOSE/.test(window._lastTriple) && isJP(idx)) sc -= 20;
          // Mon-Wed block (wd 1) vs Thu-Fri block (wd 4)
          if(wd===1 && isJP(idx)) sc -= 8; // JP prefers Mon-Wed
          if(wd===4 && isDieu(idx)) sc -= 8; // Dieu prefers Thu-Fri
          if(wd===1 && isDieu(idx)) sc -= 2;
          if(wd===4 && isJP(idx)) sc -= 2;
        }
        if(staff[idx].nightPref==='min'){ sc += (nightBlockCount[staff[idx].id]===0 ? 14 : 120); }
        if(isDiane(idx) && nightBlockCount[staff[idx].id]>=1) sc += 150;
        // Avoid consecutive same person
        if(window._lastTriple === staff[idx].name) sc += 10;
        return sc + Math.random()*1.5;
      };
      return score(a)-score(b);
    });
    let s=cands[0];
    // Ruli shortage: Patrick + Jean Paul + Dieudonne do 3-night blocks, alternating Mon-Wed / Thu-Fri
    const isPatrick = /ISHIMWE/.test(staff[s].name);
    const isJP = /NSENGIYUMVA/.test(staff[s].name);
    const isDieu = /NIYIDUHABYOSE/.test(staff[s].name);
    const isDiane = /UWASE/.test(staff[s].name);
    const canDoTriple = isPatrick || isJP || isDieu; // shortage after Faustin/Diane exit
    const maxC = canDoTriple ? 3 : Math.min(2, staff[s].maxConsecN||2);
    const canN=si=>{ for(let k=0;k<maxC;k++){ const d2=di+k; if(d2>=D) return false; if(assignedN[d2]) return false; if(!avail[si][d2]||codes[si][d2]) return false; } return true; };
    let len = maxC;
    const wish=offWishes&&offWishes.find(w=>w.staffId===staff[s].id);
    if(wish){ const wdi=dates.indexOf(wish.date); if(wdi>di&&wdi-di<=maxC&&wdi-di>=1){ len=wdi-di; } }
    else{
      // gap-aware: odd gap needs 3-block to avoid single
      let gap=0; for(let k=di;k<D;k++){ if(assignedN[k]) break; const iso=dates[k]; if(isWknd(iso) && staff.some((st,si)=> /YANSONEYE/.test(st.name) && avail[si][k] && !codes[si][k])) break; gap++; }
      if(gap%2===1 && gap>=3 && isPatrick && canN(s)) len=3;
      else if(canBlock(s)) len=Math.min(maxC,2);
      else len=1;
    }
    if(isDiane && len===1) len=0; // Diane never single
    if(len>maxC) len=maxC;
    // verify full block availability
    for(let k=0;k<len;k++){ const d2=di+k; if(d2>=D||assignedN[d2]||!avail[s][d2]||codes[s][d2]){ len=k; break; } }
    if(len<1){ alerts.push('No night cover on '+date); continue; }
    if(len===1 && !wish && di>0){
      // pair the truncated night with the PREVIOUS day instead of leaving a single
      const pd=di-1;
      if(!assignedN[pd] && avail[s][pd] && !codes[s][pd]){
        codes[s][pd]='N'; assignedN[pd]=true; nightBal[staff[s].id]++; nightNow[staff[s].id]++;
        codes[s][di]='N'; assignedN[di]=true; nightBal[staff[s].id]++; nightNow[staff[s].id]++;
        lastNight[staff[s].id]=di+1; restUntil[staff[s].id]=Math.min(D, di+3);
        for(let k=0;k<2;k++){ const rdi=di+1+k; if(rdi>=D) break; if(!avail[s][rdi]||codes[s][rdi]) continue; codes[s][rdi]=(isWknd(dates[rdi])||isHol(dates[rdi]))?'':'OFF'; }
        continue;
      }
    }
    if(len===1){ alerts.push('Only 1 night possible for '+staff[s].name+' on '+date+' — single night (unavoidable)'); }
    for(let k=0;k<len;k++){ codes[s][di+k]='N'; assignedN[di+k]=true; }
    nightBlockCount[staff[s].id]++;
    if(len===3) window._lastTriple = staff[s].name;
    nightBal[staff[s].id]++; nightNow[staff[s].id]++; lastNight[staff[s].id]=di+len;
    // optional 2nd staff on the same night (larger team rule)
    if((nightPer||1)>=2){
      for(let k=0;k<len;k++){ const d2=di+k;
        let cand2=null;
        for(let si2=0; si2<N; si2++){ if(si2===s||!avail[si2][d2]||codes[si2][d2]) continue; if(!nightOK(si2)) continue; if(d2<restUntil[si2]) continue; cand2=si2; break; }
        if(cand2!=null){ codes[cand2][d2]='N'; nightNow[staff[cand2].id]++; restUntil[staff[cand2].id]=Math.min(D,d2+2); }
      }
    }
    restUntil[staff[s].id]=Math.min(D, di+len+len); // nights + rest days before eligible again
    // rest after block (same length), blank on weekends/holidays
    for(let k=0;k<len;k++){ const rdi=di+len+k; if(rdi>=D) break;
      if(!avail[s][rdi]||codes[s][rdi]) continue;
      codes[s][rdi]= (isWknd(dates[rdi])||isHol(dates[rdi])) ? '' : 'OFF'; }
  }
  /* ---------- DAY PASS - with Aurelie AL split & no 7-day rule ---------- */
  // Helper: check if staff would work 7 consecutive days
  const wouldWork7 = (si, di)=>{
    let consec=0;
    for(let k=di-6;k<=di;k++){
      if(k<0) continue;
      const c=codes[si][k];
      if(c==='D' || c==='N' || c==='DN' || c==='H') consec++;
      else consec=0;
    }
    return consec>=6; // if already 6 days, next would be 7th
  };

  for(let di=0; di<D; di++){
    const date=dates[di]; const hol=isHol(date); const wknd=isWknd(date);

    // Handle Aurelie AL weekend split BEFORE normal logic
    if(wknd && aurelieIdx>=0 && isAurelieOnAL(di)){
      // Find Saturday index
      const dow = new Date(date+'T12:00:00').getDay(); // 0 Sun, 6 Sat
      if(dow===6){ // Saturday - assign weekend split for Sat+Sun together
        const sat=di, sun=di+1;
        if(sun<D){
          // Need two staff: one for days Sat+Sun, one for nights Sat+Sun
          let dayCands=[], nightCands=[];
          for(let si=0; si<N; si++){
            if(si===aurelieIdx) continue;
            if(isManager(si)) continue;
            if(/NGEZEKURE/.test(staff[si].name)) continue; // Beatrice no weekends
            if(!avail[si][sat] || codes[si][sat]) continue;
            if(!avail[si][sun] || codes[si][sun]) continue;
            if(wouldWork7(si, sat) || wouldWork7(si, sun)) continue;
            if(staff[si].nightPref!=='no') nightCands.push(si);
            dayCands.push(si);
          }
          // Sort by day balance for fairness
          dayCands.sort((a,b)=>dayBal[staff[a].id]-dayBal[staff[b].id]);
          nightCands.sort((a,b)=>nightBal[staff[a].id]-nightBal[staff[b].id]);

          let dayStaff=null, nightStaff=null;
          if(dayCands.length){
            dayStaff=dayCands[0];
            codes[dayStaff][sat]='D'; codes[dayStaff][sun]='D';
            dayCovered[sat]=true; dayCovered[sun]=true;
            dayBal[staff[dayStaff].id]+=2;
          }
          // Night staff must be different from day staff
          const nightPool = nightCands.filter(si=>si!==dayStaff);
          if(nightPool.length){
            nightStaff=nightPool[0];
            codes[nightStaff][sat]='N'; codes[nightStaff][sun]='N';
            assignedN[sat]=true; assignedN[sun]=true;
            nightBal[staff[nightStaff].id]+=2;
            nightBlockCount[staff[nightStaff].id]++;
            // Grant 2 OFFs after weekend nights (Thu/Fri)
            for(let k=1;k<=4;k++){
              const offIdx = sun+k;
              if(offIdx>=D) break;
              if(isWknd(dates[offIdx]) || isHol(dates[offIdx])) continue;
              if(!avail[nightStaff][offIdx] || codes[nightStaff][offIdx]) continue;
              if(codes[nightStaff][offIdx]==='D'){ codes[nightStaff][offIdx]='OFF'; break; }
            }
          }
          if(!dayStaff) alerts.push('No day cover on weekend '+date+' (Aurelie in AL)');
          if(!nightStaff) alerts.push('No night cover on weekend '+date+' (Aurelie in AL)');
          continue; // Skip normal weekend logic for Sat
        }
      } else if(dow===0){ // Sunday already handled with Saturday
        if(dayCovered[di] || assignedN[di]) continue;
      }
    }

    if(!wknd&&!hol){
      // weekday: everyone available works D, but enforce no 7-day work
      let any=false;
      for(let si=0; si<N; si++){
        if(!codes[si][di]&&avail[si][di]){
          if(wouldWork7(si, di)) { codes[si][di]='OFF'; continue; }
          codes[si][di]='D'; any=true;
        }
      }
      if(any) dayCovered[di]=true; else alerts.push('No day cover on '+date);
      continue;
    }

    // weekend / holiday: exactly 1 day worker + keep night
    if(dayCovered[di]) continue;
    let cands=[];
    for(let si=0; si<N; si++){
      if(!avail[si][di]||codes[si][di]) continue;
      if(isManager(si)) continue;
      if(/NGEZEKURE/.test(staff[si].name)) continue; // Beatrice no weekends
      if(wouldWork7(si, di)) continue;
      cands.push(si);
    }
    if(!cands.length){ if(!assignedN[di]) alerts.push('No day cover on '+date); continue; }
    cands.sort((a,b)=> dayBal[staff[a].id]-dayBal[staff[b].id]);
    const s=cands[0];
    codes[s][di]=hol?'H':'D'; dayCovered[di]=true; dayBal[staff[s].id]++;
    if(wknd&&!hol){
      const freeDays=[];
      for(let k2=1;k2<=7&&freeDays.length<2;k2++){ const d2=di+k2; if(d2>=D) break;
        if(isWknd(dates[d2])||isHol(dates[d2])) continue;
        let onDuty=0; for(let si2=0; si2<N; si2++){ if(avail[si2][d2]&&!codes[si2][d2]&&si2!==s) onDuty++; }
        if(onDuty>=4){ freeDays.push(d2); } }
      freeDays.forEach(d2=>{ if(!codes[s][d2]) codes[s][d2]='OFF'; });
    }
  }

  /* ---------- POST-PROCESS: enforce no 7 consecutive work days ---------- */
  for(let si=0; si<N; si++){
    let consec=0;
    for(let di=0; di<D; di++){
      const c=codes[si][di];
      const isWork = c==='D' || c==='N' || c==='DN' || c==='H';
      if(isWork){
        consec++;
        if(consec>=7){
          // Force OFF on this day if possible (avoid breaking night coverage if only one night staff)
          if(!assignedN[di] || codes[si][di]!=='N'){
            // Find alternative staff for this day if it was day cover
            if(codes[si][di]==='D' || codes[si][di]==='H'){
              let alt=null;
              for(let sj=0; sj<N; sj++){
                if(sj===si) continue;
                if(isManager(sj)) continue;
                if(/NGEZEKURE/.test(staff[sj].name) && isWknd(dates[di])) continue;
                if(!avail[sj][di] || codes[sj][di]) continue;
                alt=sj; break;
              }
              if(alt!==null){
                codes[alt][di]=codes[si][di];
                dayCovered[di]=true;
              }
            }
            codes[si][di]='OFF';
            consec=0;
          }
        }
      } else {
        consec=0;
      }
    }
  }

  /* ---------- IF AURELIE AL IN OCTOBER AND SHORTAGE, CANCEL HER AL ---------- */
  try{
    const activeCount = staff.filter(s=>{ const st=DB.staff.find(x=>x.id===s.id); return st && st.status==='active'; }).length;
    const aurelieLeaveOct = DB.leaves.filter(l=>l.staffId==='s4' && l.type==='AL' && l.from<='2026-10-15' && l.to>='2026-10-01');
    if(activeCount<=6 && aurelieLeaveOct.length){
      // Shortage - if administration fails to give another staff, Aurelie will not go for AL in Oct
      // We will keep her AL but add warning, and if weekend coverage fails, auto-cancel
      const hasWeekendCoverageIssue = alerts.some(a=>/weekend.*Aurelie in AL/.test(a));
      if(hasWeekendCoverageIssue){
        // Cancel Aurelie Oct AL
        DB.leaves = DB.leaves.filter(l=> !(l.staffId==='s4' && l.from<='2026-10-31' && l.to>='2026-10-01' && l.type==='AL'));
        alerts.push(' Aurelie AL in Oct cancelled due to staff shortage (Faustin & Diane exited) - administration must provide replacement');
        // Need to regenerate? For now just alert, user can regenerate
      }
    }
  }catch(e){ console.warn('Aurelie Oct check', e.message); }

  /* ---------- FINAL COVERAGE CHECKS ---------- */
  for(let di=0; di<D; di++){
    if(!assignedN[di]) alerts.push('No night cover on '+dates[di]);
    if(!dayCovered[di]) alerts.push('No day cover on '+dates[di]);
  }
  return {staff: staff.map(s=>s.name), codes, dates, alerts};
}
function genPlanNow(){
  const key=UI.wpMonth||monthKey(todayISO()); UI.wpMonth=key;
  const act=activeStaff().map(s=>({id:s.id,name:s.name,joinDate:s.joinDate,nightPref:s.nightPref||'yes',maxNights:s.maxNights==null?4:s.maxNights,maxConsecN:s.maxConsecN||3,pattern:s.pattern||'normal',weekendPattern:s.weekendPattern||'none',weekendOnly:!!s.weekendOnly}));
  if(act.length<2) return toast('Need at least 2 active staff','err');
  const nightPer=(DB.settings&&DB.settings.nightStaffPerShift)||1;
  const leaves=DB.leaves.map(l=>({staffId:l.staffId,type:l.type,from:l.from,to:l.to,backOn:l.backOn}));
  const absences=DB.absences.map(a=>({staffId:a.staffId,date:a.date}));
  const offWishes=DB.offWishes.map(w=>({staffId:w.staffId,date:w.date,blockLen:w.blockLen}));
  const holidays=DB.holidays.map(h=>({date:h.date,name:h.name}));
  const hist=historyBalances(key);
  const res=computePlan({staff:act, leaves, absences, offWishes, holidays, key, history:hist, nightPer});
  DB.workingPlans[key]=DB.workingPlans[key]||{primary:null,versions:[]};
  if(DB.workingPlans[key].primary) pushPlanVersion(key,'Before regeneration — '+new Date().toLocaleString());
  const meta={label:'Fair plan — generated '+new Date().toLocaleString(),date:todayISO(),fy:fyOf(key+'-15'),period:MONTHS3[+key.slice(5,7)-1]+'-'+key.slice(0,4),revised:false};
  DB.workingPlans[key].primary={staff:res.staff.map(n=>({name:n,codes:[]})),dates:res.dates,meta};
  // attach codes
  DB.workingPlans[key].primary.staff=res.staff.map((n,ri)=>({name:n,codes:res.codes[ri]}));
  saveDB(); toast('Fair plan generated'+(res.alerts.length?' · '+res.alerts.length+' alert(s)':''));
  renderWpBody();
}
function historyBalances(key){
  const nightCount={}, dayCount={};
  const [y,m]=key.split('-'); const ym=+y*12+(+m-1);
  // iterate previous 3 month keys
  for(let back=1; back<=3; back++){
    const mm=ym-back; const yy=Math.floor(mm/12), mo=((mm%12)+12)%12;
    const pk=yy+'-'+String(mo+1).padStart(2,'0');
    const p=(DB.workingPlans[pk]||{}).primary; if(!p) continue;
    p.staff.forEach(r=>{ const st=DB.staff.find(x=>x.name===r.name); if(!st) return;
      let n=0,d=0; (r.codes||[]).forEach(c=>{ if(c==='N'||c==='DN') n++; if(c==='D'||c==='DN') d++; });
      nightCount[st.id]=(nightCount[st.id]||0)+n; dayCount[st.id]=(dayCount[st.id]||0)+d; });
  }
  return {nightCount, dayCount};
}

function autoLeaveEnd(start, contract, type){
  if(type!=='AL'||!start) return '';
  if(contract==='statute') return addDays(start,29); // 30 consecutive days (incl start)
  // contractual: 18 working days (Mon-Fri), counting from the start day
  const d=new Date(start+'T12:00:00'); let n=0;
  while(n<18){ const dw=d.getDay(); if(dw!==0&&dw!==6) n++; if(n<18) d.setDate(d.getDate()+1); }
  return d.toISOString().slice(0,10);
}

    <td><span class="tag ${l.status==='Completed'?'green':'blue'}">${esc(l.status)}</span></td><td class="hint">${esc(l.note||'')}</td></tr>`).join('')}</table></div>`

    ${DB.leaves.slice().sort((a,b)=>b.from.localeCompare(a.from)).map(l=>`<tr><td>${esc(staffName(l.staffId))}</td><td>${esc(LEAVE_NAMES[l.type]||l.type)}</td>
    <td>${fmtDate(l.from)}</td><td>${fmtDate(l.to)}</td><td>${fmtDate(l.backOn)}</td><td class="hint">${esc(l.note||'')}</td>
    <td>${l.to<today?'<span class="tag green"> Completed</span>':`<span class="tag blue">${esc(l.status)}</span>`}</td></tr>`).join('')}</table></div></div>`;
  const lvAuto=()=>{ const st=DB.staff.find(s=>s.name===$('#lv_staff').value);
    if($('#lv_type').value==='AL'&&$('#lv_from').value&&st){
      const end=autoLeaveEnd($('#lv_from').value, st.contract, 'AL'); if(end) $('#lv_to').value=end; } };
  $('#lv_from').onchange=lvAuto; $('#lv_type').onchange=lvAuto; $('#lv_staff').onchange=lvAuto;
  $('#lvForm').addEventListener('submit',ev=>{ ev.preventDefault();
    const st=DB.staff.find(s=>s.name===$('#lv_staff').value); const from=$('#lv_from').value, to=$('#lv_to').value;
    if(to<from) return toast('End date before start','err');
    const type=$('#lv_type').value;
    // Rule: impossible to have two staff in annual leave at same time
    if(type==='AL'){
      const overlap = DB.leaves.some(l=>{
        if(l.type!=='AL' || l.status==='Ended' || l.status==='Completed') return false;
        if(l.staffId===st.id) return false;
        return !(to < l.from || from > l.to);
      });
      if(overlap){
        const ov = DB.leaves.find(l=>l.type==='AL' && l.from<=to && l.to>=from && l.staffId!==st.id);
        const who = ov ? staffName(ov.staffId) : 'another staff';
        return toast(' Impossible: '+who+' already in Annual Leave '+ov.from+'→'+ov.to+'. No 2 staff can be in AL at same time per Ruli policy. Choose different dates.','err');
      }
    }
    DB.leaves.unshift({id:uid('l'),staffId:st.id,type:type,from,to,backOn:addDays(to,1),note:$('#lv_note').value.trim(),status:'Planned',fy:fyOf(from)});
    saveDB(); toast('Leave recorded — plan re-adapts on next Generate'); renderLvBody(); });
}
function renderLvRecords(body){
  const today=todayISO();
  // Chronological from who's next to go for annual leave
  const sortedLeaves = DB.leaves.slice().sort((a,b)=>{
    // Upcoming first, then by from date
    const aUpcoming = a.from >= today ? 0 : 1;
    const bUpcoming = b.from >= today ? 0 : 1;
    if(aUpcoming!==bUpcoming) return aUpcoming-bUpcoming;
    return a.from.localeCompare(b.from);
  });
  body.innerHTML=`
  <div class="toolbar"><span class="chip"><b>${DB.leaves.length}</b> leave records</span><span class="spacer"></span>

    ${sortedLeaves.map(l=>`<tr><td>${esc(staffName(l.staffId))}</td>
      <td><span class="tag ${l.type==='AL'?'amber':l.type==='W'?'teal':l.type==='ML'?'red':'blue'}">${esc(LEAVE_NAMES[l.type]||l.type)}</span></td>

  document.querySelectorAll('[data-lvApprove]').forEach(b=>b.onclick=()=>{ const l=DB.leaves.find(x=>x.id===b.dataset.lvApprove); if(l){ l.status='Approved'; saveDB(); renderLvRecords(body); } });
  document.querySelectorAll('[data-lvTaken]').forEach(b=>b.onclick=()=>{ const l=DB.leaves.find(x=>x.id===b.dataset.lvTaken); if(l){ l.status='Taken'; saveDB(); renderLvRecords(body); } });
  document.querySelectorAll('[data-lvEnded]').forEach(b=>b.onclick=()=>{ const l=DB.leaves.find(x=>x.id===b.dataset.lvEnded); if(l){ l.status='Ended'; saveDB(); renderLvRecords(body); } });

    <div style="grid-column:1/-1"><label>Notes</label><input id="sf_note" value="${esc((s?s.note:undefined)||'')}"></div>
  </div><div class="row" style="margin-bottom:16px"><button class="btn primary" type="submit"> Save staff</button><button class="btn" type="button" onclick="closeModal()">Cancel</button></div></form>`);
  $('#sf_sex').value=(s?s.sex:undefined)||'Male'; $('#sf_contract').value=(s?s.contract:undefined)||'statute';
  $('#sf_pattern').value=(s?s.pattern:undefined)||'normal'; $('#sf_np').value=(s?s.nightPref:undefined)||'yes'; $('#sf_status').value=(s?s.status:undefined)||'active';
  $('#sf_status').onchange=()=>{ $('#sf_exitWrap').style.display=$('#sf_status').value==='exited'?'':'none'; };
  $('#sf_wknd').value=(s&&s.weekendPattern)||'none';
  $('#sf_wkonly').value=(s&&s.weekendOnly)?'1':'0';
  let sf_photo=s&&s.photo||null;
  $('#sf_upPhoto').onclick=()=>$('#sf_photoFile').click();
  $('#sf_photoFile').onchange=ev=>{ const f=ev.target.files[0]; if(!f) return; const rd=new FileReader();
    rd.onload=()=>{ sf_photo=rd.result; const pv=$('#sf_photoPrev'); pv.innerHTML='<img src="'+esc(sf_photo)+'" style="width:100%;height:100%;object-fit:cover">'; $('#sf_rmPhoto').style.display=''; }; rd.readAsDataURL(f); };
  $('#sf_rmPhoto').onclick=()=>{ sf_photo=null; $('#sf_photoPrev').innerHTML='<span style="color:var(--faint);font-size:10px">Photo</span>'; $('#sf_rmPhoto').style.display='none'; };
  // Ensure exit wrapper visible when editing exited staff
  if(s && s.status==='exited'){ const ew=$('#sf_exitWrap'); if(ew) ew.style.display=''; }
  $('#stForm2').addEventListener('submit',ev=>{ ev.preventDefault();
    const isExited = $('#sf_status').value==='exited';
    const exitVal = $('#sf_exit').value || todayISO();
    const data={name:$('#sf_name').value.trim(),role:$('#sf_role').value.trim(),sex:$('#sf_sex').value,dob:$('#sf_dob').value||null,
      phone:$('#sf_phone').value.trim(),email:$('#sf_email').value.trim(),contract:$('#sf_contract').value,pattern:$('#sf_pattern').value,
      nightPref:$('#sf_np').value,maxNights:+$('#sf_max').value||0,weekendPattern:$('#sf_wknd').value||'none',weekendOnly:$('#sf_wkonly').value==='1',photo:sf_photo||null,joinDate:$('#sf_join').value,status:isExited?'exited':'active',
      exitDate:isExited?exitVal:null,note:$('#sf_note').value.trim()};
    if(!data.name) return toast('Name required','warn');
    if(isExited && !data.exitDate) data.exitDate=todayISO();
    if(s){
      Object.assign(s,data);
      toast(isExited ? ' Staff marked as EXITED on '+data.exitDate+' — history kept, excluded from future plans' : ' Staff updated to ACTIVE', isExited?'warn':'ok');
    } else {
      DB.staff.push({id:uid('s'),...data});
      toast(isExited ? ' Exited staff recorded — '+data.exitDate : ' Staff registered as active', isExited?'warn':'ok');
    }
    try{ saveDB(); }catch(e){ toast('Save failed: '+e.message,'err'); console.error(e); }
    closeModal();
    // Force reload from storage to verify save
    try{
      const check = JSON.parse(localStorage.getItem(DB_KEY));
      const saved = check.staff.find(x=>x.name===data.name);
      if(saved) console.log('Verified saved:', saved.name, saved.status, saved.exitDate);
    }catch(e){}
    renderStaff();
    renderDash();
  });
}

function renderSecurity(body){
  if(typeof isAdmin==='function' && !isAdmin()){
    body.innerHTML=`<div class="viewer-banner"><div class="ic"></div><div><b>Security — Admin Only</b><br><span style="font-weight:500">Change password and 2-FA settings are visible only to Admin.</span></div><button class="btn primary sm" onclick="openAuth('pass')" style="margin-left:auto"> Admin Login</button></div>`;
    return;
  }
  const auth = getAuthRec();
  const twoFA = auth.twoFAEnabled ? true : false;
  const backupCodes = auth.backupCodes || [];

  body.innerHTML=`
  <div class="grid g-2" style="gap:16px">
    <div class="card gold-accent"><h3> Change Password</h3>
      <form id="changePassForm"><div class="form-grid fg-2">
        <div><label>Current Password</label><input type="password" id="cp_old" placeholder="Current" required></div>
        <div><label>New Password (≥8 chars, strong)</label><input type="password" id="cp_new" placeholder="New strong password" required style="border-left:3px solid var(--gold)"></div>
        <div><label>Confirm New Password</label><input type="password" id="cp_new2" placeholder="Repeat new password" required></div>
        <div style="display:flex; align-items:flex-end"><button class="btn primary" type="submit"> Update Password</button></div>
      </div></form>
      <p class="hint" style="margin-top:10px">Password is stored locally (localStorage) for this static site. Use strong password with numbers + symbols. No credential shown publicly.</p>
    </div>

    <div class="card gold-accent"><h3> Authenticator App 2-FA (Google Authenticator / Authy) — Compatible</h3>
      <div class="alert ${auth.totpEnabled?'ok':'info'}" style="margin-bottom:12px">
        ${auth.totpEnabled?'<b> Authenticator App Enabled</b> — Login requires code from Google Authenticator/Authy. Most secure, works offline.' : '<b> Authenticator App Disabled</b> — Enable to use Google Authenticator, Authy, 1Password etc. (TOTP, 30s).'}
      </div>
      <div class="form-grid fg-2">
        <div><label>Authenticator 2-FA</label><select id="totp_toggle"><option value="0">Disabled</option><option value="1">Enabled — Require Authenticator code</option></select></div>
        <div><label>TOTP Secret (Base32, private)</label><div class="row" style="gap:8px"><input id="totp_secret" value="${esc(auth.totpSecret||'')}" placeholder="Auto-generated on enable" style="flex:1; font-family:monospace"><button class="btn sm" type="button" id="totp_gen">Generate</button></div></div>
        <div style="grid-column:1/-1"><div id="totp_qr" style="display:flex; justify-content:center; padding:12px; background:#fff; border-radius:12px; border:1px solid var(--edge); min-height:0"></div><p class="hint" style="margin-top:8px">Scan QR with Google Authenticator, Authy, 1Password, etc. Or enter secret manually. QR uses otpauth:// URI compatible with all authenticator apps.</p></div>
        <div><label>Verify Code from App (6-digit)</label><div class="row" style="gap:8px"><input id="totp_verify" maxlength="6" placeholder="123456" style="flex:1; letter-spacing:4px; text-align:center; font-weight:800"><button class="btn teal sm" type="button" id="totp_verifyBtn">Verify & Save</button></div></div>
        <div style="display:flex; align-items:flex-end"><button class="btn primary sm" id="totp_save"> Save Authenticator Settings</button></div>
      </div>
    </div>

    <div class="card gold-accent"><h3> Email OTP 2-FA (Backup)</h3>
      <div class="alert ${twoFA?'ok':'warn'}" style="margin-bottom:12px">
        ${twoFA?'<b> 2-FA Enabled</b> — Login requires Password + OTP (6-digit, 5 min). Extra security against hijacking.' : '<b> 2-FA Disabled</b> — Enable for best security. Login will require Password + OTP.'}
      </div>
      <div class="form-grid fg-2">
        <div><label>2-FA Status</label>
          <select id="twofa_toggle"><option value="0">Disabled</option><option value="1">Enabled — Require OTP after password</option></select>
        </div>
        <div><label>Registered Email for OTP</label><input id="twofa_email" value="${esc(auth.email||'')}" placeholder="registered admin email"></div>
        <div style="grid-column:1/-1">
          <div class="row" style="gap:10px; margin-top:8px">
            <button class="btn primary sm" id="twofa_enable"> Save 2-FA Settings</button>
            <button class="btn teal sm" id="twofa_genCodes"> Generate Backup Codes</button>
            <button class="btn sm" id="twofa_test"> Send Test OTP</button>
          </div>
        </div>
        ${backupCodes.length?`<div style="grid-column:1/-1"><label>Backup Codes (one-time use, store safely)</label><div class="grid g-3" style="gap:8px">${backupCodes.map(c=>`<span class="chip" style="font-family:monospace; font-weight:800; border-left:3px solid var(--gold)">${esc(c)}</span>`).join('')}</div><p class="hint">Each backup code can be used once if you lose email access. Regenerate to invalidate old ones.</p></div>`:''}
      </div>
      <hr style="margin:16px 0">
      <h3 style="font-size:13px">How 2-FA works on this static site (no server):</h3>
      <ol style="font-size:12.5px; margin:8px 0 0 18px; line-height:1.6; color:var(--muted)">
        <li>Enable 2-FA → Save → Login will now require <b>Password + OTP</b></li>
        <li>On login, after correct password, system auto-generates 6-digit OTP valid 5 min, shows it here + opens mailto to your registered email</li>
        <li>Enter OTP to complete login — session 24h</li>
        <li>Backup codes work if email unavailable — each code one-time</li>
        <li>For true server email delivery, integrate EmailJS API key in Data & Backup → add key → OTP will be emailed automatically</li>
      </ol>
    </div>

    <div class="card"><h3> Session & Security Info</h3>
      <div class="grid g-2" style="gap:12px">
        <div><label>Current Session</label><div class="chip">${(function(){ const s=getSession(); return s? 'Active — expires '+ new Date(s.exp).toLocaleString() : 'No active session'; })()}</div></div>
        <div><label>Last Password Change</label><div class="chip">${esc(auth.lastPassChange||auth.created||'—')}</div></div>
        <div><label>Admin Username</label><div class="chip"><b>${esc(auth.username||'admin')}</b> · private</div></div>
        <div><label>Registered Email</label><div class="chip">${esc(auth.email||'—')} · private</div></div>
      </div>
      <div class="row" style="margin-top:16px; gap:10px">
        <button class="btn danger sm" id="secLogout">Logout Everywhere</button>
        <button class="btn sm" id="secClearOTP">Clear OTP & Backup Codes</button>
      </div>
    </div>
  </div>`;

  document.getElementById('twofa_toggle').value = twoFA ? '1' : '0';
  // TOTP handlers
  const totpToggle=document.getElementById('totp_toggle');
  const totpSecretInp=document.getElementById('totp_secret');
  const totpQR=document.getElementById('totp_qr');
  if(totpToggle) totpToggle.value = auth.totpEnabled ? '1' : '0';
  async function renderTOTPQR(){
    const sec=totpSecretInp.value.trim();
    if(!sec){ totpQR.innerHTML='<span class="hint">Generate secret first</span>'; return; }
    const uri=getTOTPAuthURI(sec, auth.username||'admin', 'Ruli DH Lab');
    totpQR.innerHTML='<div style="display:flex; flex-direction:column; align-items:center; gap:10px"><div class="hint">Generating QR...</div></div>';
    try{
      if(window.QRCode && window.QRCode.toCanvas){
        try{
          const c=document.createElement('canvas');
          c.style.cssText='width:200px;height:200px; border:1px solid var(--edge); border-radius:12px; background:#fff; padding:8px';
          await window.QRCode.toCanvas(c, uri, {width:200, margin:1, errorCorrectionLevel:'M'});
          totpQR.innerHTML='';
          totpQR.appendChild(c);
          const uriDiv=document.createElement('div');
          uriDiv.style.cssText='font-family:monospace; font-size:10px; word-break:break-all; background:var(--bg2); padding:8px; border-radius:8px; max-width:320px; border:1px solid var(--edge)';
          uriDiv.textContent=uri;
          totpQR.appendChild(uriDiv);
          const hint=document.createElement('p');
          hint.className='hint';
          hint.style.marginTop='6px';
          hint.textContent='Scan with Google Authenticator / Authy / 1Password';
          totpQR.appendChild(hint);
          return;
        }catch(e){ console.warn('QRCode toCanvas failed', e.message); }
      }
      if(window.QRCode && window.QRCode.toDataURL){
        try{
          const url = await window.QRCode.toDataURL(uri, {width:200, margin:1});
          totpQR.innerHTML=`<img src="${url}" alt="QR Code" style="width:200px;height:200px; border:1px solid var(--edge); border-radius:12px; background:#fff; padding:8px"><div style="font-family:monospace; font-size:10px; word-break:break-all; margin-top:8px; background:var(--bg2); padding:8px; border-radius:8px; max-width:320px; border:1px solid var(--edge)">${esc(uri)}</div><p class="hint" style="margin-top:6px">Scan with authenticator app</p>`;
          return;
        }catch(e){ console.warn('QRCode toDataURL failed', e.message); }
      }
      const qrServerUrl = 'https://api.qrserver.com/v1/create-qr-code/?size=200x200&data='+encodeURIComponent(uri);
      totpQR.innerHTML=`<img src="${qrServerUrl}" alt="QR Code" style="width:200px;height:200px; border:1px solid var(--edge); border-radius:12px; background:#fff; padding:8px" onerror="this.onerror=null; this.src='https://chart.googleapis.com/chart?chs=240x240&chld=M|0&cht=qr&chl='+encodeURIComponent('${esc(uri)}')"><div style="font-family:monospace; font-size:10px; word-break:break-all; margin-top:8px; background:var(--bg2); padding:8px; border-radius:8px; max-width:320px; border:1px solid var(--edge)">${esc(uri)}</div><p class="hint" style="margin-top:6px">If QR fails, copy URI into authenticator app manually.</p>`;
    }catch(e){
      totpQR.innerHTML='<span class="hint">QR error: '+esc(e.message)+'</span><br><div style="font-family:monospace; font-size:10px; word-break:break-all; background:var(--bg2); padding:8px; border-radius:8px; border:1px solid var(--edge)">'+esc(uri)+'</div>';
    }
  }
  document.getElementById('totp_gen').onclick=()=>{
    const sec=generateTOTPSecret();
    totpSecretInp.value=sec;
    renderTOTPQR();
    toast('Secret generated — scan QR with authenticator app','ok');
  };
  totpSecretInp.oninput=renderTOTPQR;
  renderTOTPQR();

  document.getElementById('totp_verifyBtn').onclick=async()=>{
    const code=document.getElementById('totp_verify').value.trim();
    const sec=totpSecretInp.value.trim();
    if(!sec) return toast('Generate secret first','warn');
    if(!code) return toast('Enter 6-digit code from app','warn');
    const ok = await verifyTOTP(code, sec);
    if(ok) toast(' Code valid — authenticator app compatible! Save settings.','ok');
    else toast(' Invalid code — check time sync on phone','err');
  };

  document.getElementById('totp_save').onclick=()=>{
    const enabled=totpToggle.value==='1';
    const sec=totpSecretInp.value.trim();
    if(enabled && !sec) return toast('Generate secret before enabling','warn');
    const authRec=getAuthRec();
    authRec.totpEnabled=enabled;
    authRec.totpSecret=enabled?sec:null;
    authRec.lastTOTPChange=new Date().toISOString();
    saveAuthRec(authRec);
    toast(enabled?' Authenticator App 2-FA Enabled — compatible with Google Authenticator/Authy':' Authenticator App Disabled','ok');
    renderSecurity(body);
  };

  
  document.getElementById('changePassForm').addEventListener('submit',ev=>{
    ev.preventDefault();
    const oldP=document.getElementById('cp_old').value;
    const newP=document.getElementById('cp_new').value;
    const newP2=document.getElementById('cp_new2').value;
    const auth=getAuthRec();
    if(oldP!==auth.password) return toast('Current password incorrect','err');
    if(newP.length<8) return toast('New password must be ≥8 chars for security','warn');
    if(newP!==newP2) return toast('New passwords do not match','err');
    if(newP===oldP) return toast('New password must be different','warn');
    auth.password=newP;
    auth.lastPassChange=new Date().toISOString();
    saveAuthRec(auth);
    toast(' Password updated — use new password next login','ok');
    document.getElementById('cp_old').value=''; document.getElementById('cp_new').value=''; document.getElementById('cp_new2').value='';
    renderSecurity(body);
  });

  document.getElementById('twofa_enable').onclick=()=>{
    const enabled=document.getElementById('twofa_toggle').value==='1';
    const email=document.getElementById('twofa_email').value.trim();
    if(!email || !email.includes('@')) return toast('Valid email required for OTP','warn');
    const auth=getAuthRec();
    auth.twoFAEnabled=enabled;
    auth.email=email;
    auth.last2FAChange=new Date().toISOString();
    saveAuthRec(auth);
    toast(enabled ? ' 2-FA Enabled — Password + OTP required' : ' 2-FA Disabled', enabled?'ok':'warn');
    renderSecurity(body);
  };

  document.getElementById('twofa_genCodes').onclick=()=>{
    const codes = Array.from({length:8},()=> Math.random().toString(36).slice(2,6).toUpperCase() + '-' + Math.random().toString(36).slice(2,6).toUpperCase());
    const auth=getAuthRec();
    auth.backupCodes=codes;
    saveAuthRec(auth);
    toast(' 8 backup codes generated — store safely','ok');
    renderSecurity(body);
  };

  document.getElementById('twofa_test').onclick=()=>{
    const auth=getAuthRec();
    const email=auth.email;
    const code=sendOTP(email,'login');
    toast(' Test OTP: '+code+' (5 min) — check mailto and screen','ok');
  };

  document.getElementById('secLogout').onclick=()=>{
    confirmDlg('Logout everywhere? This will clear session on this device and require re-login with password + OTP if 2-FA enabled.',()=>{
      clearSession();
      try{ localStorage.removeItem('labSystems.session.v1_persist'); }catch(e){}
      toast('Logged out everywhere — re-login required','warn');
      updateAuthUI();
      renderSecurity(body);
    });
  };

  document.getElementById('secClearOTP').onclick=()=>{
    confirmDlg('Clear OTP and backup codes? This will invalidate all pending OTPs.',()=>{
      try{ localStorage.removeItem('labSystems.otp.v1'); }catch(e){}
      const auth=getAuthRec(); auth.backupCodes=[]; saveAuthRec(auth);
      toast('OTP & backup codes cleared','ok');
      renderSecurity(body);
    });
  };
}

'use strict';

function setTab(tab,silent){
  if(!RENDER[tab]) tab='dash';
  UI.tab=tab;
  try{
    localStorage.setItem('labSystems.lastTab.v1', tab);
    if(!silent) location.hash = tab;
  }catch(e){}
  $$('.nav-item').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
  $$('#bottomNav .bnav-item').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
  $$('.module').forEach(m=>m.classList.remove('active'));
  const mod=$('#mod-'+tab); if(mod) mod.classList.add('active');
  const [tt,ts]=TAB_META[tab]; const t1=$('#topTitle'), t2=$('#topSub'); if(t1) t1.textContent=(tt||'').trim(); if(t2) t2.textContent=(ts||'').trim();
  try{ RENDER[tab](); updateAuthUI(); }catch(err){ console.error('Render error',tab,err); toast('Module error: '+err.message,'err'); }
}

  $('#sideFoot').innerHTML='<span id="loadedBadge" style="display:none;color:var(--green);font-weight:800;font-size:12px"> App loaded &amp; running</span><br>Lab Systems v4.0 · Local data · auto-saved · <b>'+st+'</b> active staff<br><span id="saveState" style="color:var(--green)">● saved</span>';
}
function wireNav(){

  nav.addEventListener('click',e=>{ const b=e.target.closest('.nav-item'); if(!b) return;
    setTab(b.dataset.tab); closeSidebar(); });
  const bottomNav=document.getElementById('bottomNav');

      const b=e.target.closest('.bnav-item'); if(!b) return;
      setTab(b.dataset.tab);
    });
  }
  $('#hamburger').addEventListener('click',e=>{ e.stopPropagation();

    else{
      document.body.classList.toggle('nav-closed');
      $('#sidebar').classList.remove('open');
      const mw = document.getElementById('mainWrap');

        if(document.body.classList.contains('nav-closed')){ mw.style.gridColumn='1'; mw.style.width='100%'; }

      if(a.dataset.act==='del') confirmDlg('Delete this sample record?',()=>{ DB.samples=DB.samples.filter(x=>x.id!==id); saveDB(); renderSamples(); });

function showBootError(msg){

      __bootErr=msg;
      var box=document.getElementById('bootErr'); if(!box){

function ensureCurrentPlan(){
  // Force clear any cached Sep 2026 plan where Patrick was incorrectly shown working while in AL
  try{
    const sepKey='2026-09';
    if(DB.workingPlans[sepKey] && DB.workingPlans[sepKey].primary){
      const p=DB.workingPlans[sepKey].primary;
      const patIdx = p.staff.findIndex(r=>/ISHIMWE/.test(r.name));
      if(patIdx>=0){
        const sepDays = p.dates.filter(d=>d.slice(0,7)===sepKey);
        const hasWorkInSep = sepDays.some((d,idx)=>{
          const gi=p.dates.indexOf(d);
          const code=p.staff[patIdx].codes[gi];
          return code && code!=='AL' && code!=='W' && code!=='';
        });
        if(hasWorkInSep){
          console.log('Clearing Sep 2026 cached plan - Patrick was working while in AL');
          delete DB.workingPlans[sepKey];
        }
      }
    }
    // Also clear Aug and Oct 2026 if Patrick incorrectly working
    ['2026-08','2026-10'].forEach(k=>{
      if(DB.workingPlans[k] && DB.workingPlans[k].primary){
        const p=DB.workingPlans[k].primary;
        const patIdx = p.staff.findIndex(r=>/ISHIMWE/.test(r.name));
        if(patIdx>=0){
          const days = p.dates.filter(d=>d.slice(0,7)===k);
          const hasWork = days.some(d=>{
            const gi=p.dates.indexOf(d);
            const code=p.staff[patIdx].codes[gi];
            return code && code!=='AL' && code!=='W' && code!=='';
          });
          // If Patrick has AL covering whole month but shows work, clear
          const patLeaves = DB.leaves.filter(l=>l.staffId==='s5' && l.type==='AL' && l.from<=k+'-15' && l.to>=k+'-15');
          if(patLeaves.length && hasWork) delete DB.workingPlans[k];
        }
      }
    });
  }catch(e){ console.warn('ensureCurrentPlan cleanup', e.message); }
  const key=monthKey(todayISO());
  if(DB.workingPlans[key]&&DB.workingPlans[key].primary) return;
  const act=activeStaff().map(s=>({id:s.id,name:s.name,joinDate:s.joinDate,nightPref:s.nightPref||'yes',maxNights:s.maxNights==null?4:s.maxNights,maxConsecN:s.maxConsecN||3,pattern:s.pattern||'normal',weekendPattern:s.weekendPattern||'none',weekendOnly:!!s.weekendOnly}));

  const res=computePlan({staff:act, leaves, absences:DB.absences.map(a=>({staffId:a.staffId,date:a.date})),

    key, history:historyBalances(key)});
  DB.workingPlans[key]=DB.workingPlans[key]||{primary:null,versions:[]};
  DB.workingPlans[key].primary={staff:res.staff.map((n,ri)=>({name:n,codes:res.codes[ri]})), dates:res.dates,

      }

function saveFirebaseConfig(cfg){
  try{ localStorage.setItem(FIREBASE_KEY, JSON.stringify(cfg)); }catch(e){ console.warn('saveFirebase', e.message); }
}
function initFirebase(){
  try{
    const cfg=getFirebaseConfig();
    if(!cfg || !cfg.apiKey || !cfg.databaseURL) return false;
    if(typeof firebase==='undefined' || !firebase.initializeApp) return false;
    if(!firebaseApp){
      // Avoid duplicate init
      try{
        firebaseApp = firebase.apps && firebase.apps.length ? firebase.apps[0] : firebase.initializeApp(cfg);
      }catch(e){
        // If already initialized with different config, try to use existing
        firebaseApp = firebase.app();
      }
      firebaseDB = firebase.database();
    }
    cloudSyncEnabled = !!cfg.enabled;
    return true;
  }catch(e){ console.warn('initFirebase', e.message); return false; }
}
function cloudSave(){
  try{
    const cfg = (typeof getFirebaseConfig==='function') ? getFirebaseConfig() : null;
    const enabled = cfg ? cfg.enabled : cloudSyncEnabled;
    if(!enabled) return;
    if(typeof isAdmin==='function' && !isAdmin()) return;
    const payload = JSON.parse(JSON.stringify(DB));
    const path = (cfg && cfg.path) ? cfg.path : CLOUD_PATH;
    // Try Firebase SDK first
    if(firebaseDB && typeof firebaseDB.ref==='function'){
      try{
        firebaseDB.ref(path).set({data: payload, at: Date.now(), by: (typeof getAuthRec==='function'?getAuthRec().username:'admin')});
        console.log('Cloud save via SDK OK');
        return;
      }catch(e){ console.warn('SDK save failed, trying REST', e.message); }
    }
    // Fallback REST - works with databaseURL only, no apiKey needed, instant live across phone & PC
    if(cfg && cfg.databaseURL){
      const url = cfg.databaseURL.replace(/\/$/,'') + '/' + path.replace(/^\//,'') + '.json';
      fetch(url, {method:'PUT', body: JSON.stringify({data: payload, at: Date.now()}), headers:{'Content-Type':'application/json'}})
        .then(r=>{ if(r.ok) console.log('Cloud save via REST OK - live instantly'); else console.warn('REST save status', r.status); })
        .catch(e=>{ console.warn('REST save err', e.message); });
    }
  }catch(e){ console.warn('cloudSave', e.message); }
}
function cloudLoadAndListen(onFirst){
  try{
    const cfg=getFirebaseConfig();
    if(!cfg || !cfg.enabled) { if(onFirst) onFirst(false); return; }
    // Try SDK init, but don't fail if SDK not loaded yet (REST fallback)
    try{ initFirebase(); }catch(e){}
    const path = (cfg.path||CLOUD_PATH);
    const useSDK = !!(firebaseDB && typeof firebaseDB.ref==='function');

    if(!useSDK){
      // REST fallback for instant live - no apiKey needed
      if(cfg.databaseURL){
        const url = cfg.databaseURL.replace(/\/$/,'') + '/' + path.replace(/^\//,'') + '.json';
        fetch(url).then(r=>r.json()).then(val=>{
          try{
            if(val && val.data && val.data.meta){
              const cloudData=val.data;
              const localRaw=localStorage.getItem('labSystems.v1');
              let shouldOverwrite=false;
              if(!localRaw) shouldOverwrite=true;
              else{
                try{
                  const local=JSON.parse(localRaw);
                  const localTime = local.meta && local.meta.lastSave ? new Date(local.meta.lastSave).getTime() : 0;
                  const cloudTime = cloudData.meta && cloudData.meta.lastSave ? new Date(cloudData.meta.lastSave).getTime() : (val.at||0);
                  if(cloudTime > localTime) shouldOverwrite=true;
                }catch(e){ shouldOverwrite=true; }
              }
              if(shouldOverwrite){
                console.log('Cloud REST newer — overwriting local - EQA synced phone->PC');
                DB=cloudData;
                try{ localStorage.setItem('labSystems.v1', JSON.stringify(DB)); }catch(e){}
                if(onFirst) onFirst(true);
                try{ if(typeof toast==='function') toast('Live data from cloud — EQA synced phone→PC','ok'); }catch(e){}
              }else{
                if(onFirst) onFirst(false);
              }
            }else{
              if(onFirst) onFirst(false);
            }
          }catch(e){ if(onFirst) onFirst(false); }
        }).catch(e=>{ console.warn('REST load err', e.message); if(onFirst) onFirst(false); });
        // For live updates, poll every 15s via REST (since SDK not available)
        try{
          setInterval(()=>{
            const url2 = cfg.databaseURL.replace(/\/$/,'') + '/' + path.replace(/^\//,'') + '.json';
            fetch(url2).then(r=>r.json()).then(val=>{
              if(!val || !val.data) return;
              const cloudData=val.data;
              const cloudTime = cloudData.meta && cloudData.meta.lastSave ? new Date(cloudData.meta.lastSave).getTime() : (val.at||0);
              const localTime = DB && DB.meta && DB.meta.lastSave ? new Date(DB.meta.lastSave).getTime() : 0;
              if(cloudTime > localTime + 5000){
                console.log('Live REST poll update');
                DB=cloudData;
                try{ localStorage.setItem('labSystems.v1', JSON.stringify(DB)); }catch(e){}
                try{ if(UI && UI.tab && RENDER[UI.tab]){ RENDER[UI.tab](); updateChips(); updateAuthUI(); } }catch(e){}
              }
            });
          }, 15000);
        }catch(e){}
        return;
      }
      if(onFirst) onFirst(false);
      return;
    }

    if(!firebaseDB) { if(onFirst) onFirst(false); return; }
    // One-time load
    firebaseDB.ref(CLOUD_PATH).once('value').then(snap=>{
      try{
        const val=snap.val();
        if(val && val.data && val.data.meta){
          const cloudData=val.data;
          const localRaw=localStorage.getItem('labSystems.v1');
          let shouldOverwrite=false;
          if(!localRaw) shouldOverwrite=true;
          else{
            try{
              const local=JSON.parse(localRaw);
              const localTime = local.meta && local.meta.lastSave ? new Date(local.meta.lastSave).getTime() : 0;
              const cloudTime = cloudData.meta && cloudData.meta.lastSave ? new Date(cloudData.meta.lastSave).getTime() : (val.at||0);
              if(cloudTime > localTime) shouldOverwrite=true;
            }catch(e){ shouldOverwrite=true; }
          }
          if(shouldOverwrite){
            console.log('Cloud newer — overwriting local');
            DB=cloudData;
            try{ localStorage.setItem('labSystems.v1', JSON.stringify(DB)); }catch(e){}
            if(onFirst) onFirst(true);
          }else{
            if(onFirst) onFirst(false);
          }
        }else{
          if(onFirst) onFirst(false);
        }
      }catch(e){ console.warn('cloud once', e.message); if(onFirst) onFirst(false); }
    }).catch(e=>{ console.warn('cloud once err', e.message); if(onFirst) onFirst(false); });

    // Live listener for future changes
    firebaseDB.ref(CLOUD_PATH).on('value', snap=>{
      try{
        const val=snap.val();
        if(!val || !val.data) return;
        const cloudData=val.data;
        const cloudTime = cloudData.meta && cloudData.meta.lastSave ? new Date(cloudData.meta.lastSave).getTime() : (val.at||0);
        const localTime = DB && DB.meta && DB.meta.lastSave ? new Date(DB.meta.lastSave).getTime() : 0;
        // If cloud newer than local by >5s, update
        if(cloudTime > localTime + 5000){
          console.log('Live cloud update received');
          DB=cloudData;
          try{ localStorage.setItem('labSystems.v1', JSON.stringify(DB)); }catch(e){}
          // Re-render current tab if admin or viewer
          try{
            if(typeof UI!=='undefined' && UI.tab && typeof RENDER!=='undefined' && RENDER[UI.tab]){
              RENDER[UI.tab]();
              if(typeof updateChips==='function') updateChips();
              if(typeof updateAuthUI==='function') updateAuthUI();
            }
            if(typeof toast==='function') toast('Live update from cloud — data synced','ok');
          }catch(e){}
        }
      }catch(e){ console.warn('cloud listener', e.message); }
    });

  }catch(e){ console.warn('cloudLoad', e.message); if(onFirst) onFirst(false); }
}

function genOTP(){
  return String(Math.floor(100000 + Math.random()*900000));
}
function sendOTP(email, purpose){
  const code = genOTP();
  const rec = {code, email: email.toLowerCase(), purpose, at:Date.now(), exp: Date.now()+ 5*60*1000};
  try{ localStorage.setItem(OTP_KEY, JSON.stringify(rec)); }catch(e){}
  // Try real email delivery via EmailJS if configured (zero-cost)
  try{
    const cfg = (typeof getEmailJSConfig==='function') ? getEmailJSConfig() : {enabled:false};
    if(cfg && cfg.enabled && cfg.serviceId && cfg.templateId && cfg.publicKey && typeof sendEmailViaEmailJS==='function'){
      sendEmailViaEmailJS(email, code, purpose).then(r=>{
        if(r.ok){
          if(typeof toast==='function') toast(' OTP sent via EmailJS to '+email+' — check inbox','ok');
        }else{
          console.log('EmailJS fallback to mailto:', r.reason);
        }
      }).catch(e=>{ console.warn('EmailJS err', e.message); });
    }
  }catch(e){ console.warn('sendOTP EmailJS check', e.message); }
  return code;
}
function verifyOTP(inputCode, email, purpose){
  try{
    const rec = JSON.parse(localStorage.getItem(OTP_KEY)||'null');
    if(!rec) return {ok:false, msg:'No OTP sent — click Send OTP first'};
    if(Date.now() > rec.exp) return {ok:false, msg:'OTP expired — request new one (5 min validity)'};
    if(rec.code !== String(inputCode).trim()) return {ok:false, msg:'Invalid OTP'};
    if(email && rec.email !== email.toLowerCase()) return {ok:false, msg:'Email mismatch'};
    if(purpose && rec.purpose !== purpose) return {ok:false, msg:'OTP purpose mismatch'};
    return {ok:true, rec};
  }catch(e){ return {ok:false, msg:'OTP error: '+e.message}; }
}

/* ===== TOTP - Authenticator App Compatible (Google Authenticator, Authy) ===== */
function base32Encode(bytes){
  const alphabet='ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
  let bits=0, value=0, output='';
  for(let i=0;i<bytes.length;i++){
    value = (value<<8) | bytes[i];
    bits+=8;
    while(bits>=5){
      output+=alphabet[(value>>>(bits-5)) & 31];
      bits-=5;
    }
  }
  if(bits>0) output+=alphabet[(value<<(5-bits)) & 31];
  return output;
}
function base32Decode(str){
  const alphabet='ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
  str=str.toUpperCase().replace(/=+$/,'').replace(/[^A-Z2-7]/g,'');
  let bits=0, value=0, output=[];
  for(let i=0;i<str.length;i++){
    const idx=alphabet.indexOf(str[i]); if(idx===-1) continue;
    value = (value<<5) | idx;
    bits+=5;
    if(bits>=8){
      output.push((value>>>(bits-8)) & 255);
      bits-=8;
    }
  }
  return new Uint8Array(output);
}
function generateTOTPSecret(){
  const arr=new Uint8Array(20); // 160 bits
  if(window.crypto && window.crypto.getRandomValues) crypto.getRandomValues(arr);
  else for(let i=0;i<arr.length;i++) arr[i]=Math.floor(Math.random()*256);
  return base32Encode(arr);
}
async function hmacSHA1(key, data){
  const cryptoKey = await crypto.subtle.importKey('raw', key, {name:'HMAC', hash:'SHA-1'}, false, ['sign']);
  const sig = await crypto.subtle.sign('HMAC', cryptoKey, data);
  return new Uint8Array(sig);
}
async function generateTOTP(secret, timeStep=30, digits=6, timestamp=Date.now()){
  const key = base32Decode(secret);
  const counter = Math.floor(timestamp/1000/timeStep);
  const counterBytes = new Uint8Array(8);
  let c=counter;
  for(let i=7;i>=0;i--){ counterBytes[i]=c & 0xff; c>>=8; }
  const hmac = await hmacSHA1(key, counterBytes);
  const offset = hmac[hmac.length-1] & 0x0f;
  const bin = ((hmac[offset] & 0x7f)<<24) | ((hmac[offset+1] & 0xff)<<16) | ((hmac[offset+2] & 0xff)<<8) | (hmac[offset+3] & 0xff);
  const otp = bin % (10**digits);
  return String(otp).padStart(digits,'0');
}
async function verifyTOTP(code, secret, window=1){
  const now=Date.now();
  for(let i=-window;i<=window;i++){
    const t = now + i*30*1000;
    const expected = await generateTOTP(secret, 30, 6, t);
    if(expected===String(code).trim()) return true;
  }
  return false;
}
function getTOTPAuthURI(secret, account='admin', issuer='Ruli DH Lab'){
  return `otpauth://totp/${encodeURIComponent(issuer)}:${encodeURIComponent(account)}?secret=${secret}&issuer=${encodeURIComponent(issuer)}&algorithm=SHA1&digits=6&period=30`;
}

function resolveOverlappingAL(){
  try{
    const als = DB.leaves.filter(l=>l.type==='AL' && l.status!=='Ended' && l.status!=='Completed').sort((a,b)=>a.from.localeCompare(b.from));
    for(let i=0;i<als.length;i++){
      for(let j=i+1;j<als.length;j++){
        const a=als[i], b=als[j];
        if(a.staffId===b.staffId) continue;
        if(!(b.from <= a.to && b.to >= a.from)) continue; // no overlap
        // Overlap found - push b after a
        const dur = daysBetween(b.from, b.to);
        b.from = addDays(a.to, 1);
        b.to = addDays(b.from, dur);
        b.backOn = addDays(b.to, 1);
        b.note = (b.note||'') + ' (auto-shifted to avoid 2 AL overlap)';
      }
    }
  }catch(e){ console.warn('resolveOverlappingAL', e.message); }
}

/* ================= EQA / PROFICIENCY TESTING MODULE =================
   - Quarters: Q1 = Jul-Sep, Q2 = Oct-Dec, Q3 = Jan-Mar, Q4 = Apr-Jun (FY starts July)
   - Programs: Hematology (WBC,RBC,HCT,MCV,PLT,HGB), Biochemistry (Glucose,Creatinine,ALT), TB (MTB GeneXpert), HIV (%), Serology (RPR,HCV)
   - HIV & TB scored in %, others in SD, Pass if within +-2SD or >=80% for %
*/
const EQA_PROGRAMS = {
  Hematology: {tests:['WBC','RBC','HCT','MCV','PLT','Hemoglobin'], scoring:'SD', unit:'SD'},
  Biochemistry: {tests:['Glucose','Creatinine','ALT'], scoring:'SD', unit:'SD'},
  TB: {tests:['MTB GeneXpert'], scoring:'%', unit:'%'},
  HIV: {tests:['HIV'], scoring:'%', unit:'%'},
  Serology: {tests:['RPR','HCV'], scoring:'SD', unit:'SD'}
};

function quarterLabel(dateISO){
  const d=new Date(dateISO+'T12:00:00'); const m=d.getMonth(); const y=d.getFullYear();
  // FY starts July: Q1 Jul-Sep, Q2 Oct-Dec, Q3 Jan-Mar, Q4 Apr-Jun
  let q, fyYear;
  if(m>=6 && m<=8){ q=1; fyYear=y; }
  else if(m>=9 && m<=11){ q=2; fyYear=y; }
  else if(m>=0 && m<=2){ q=3; fyYear=y-1; }
  else { q=4; fyYear=y-1; }
  return `Q${q} ${fyYear}/${String(fyYear+1).slice(2)}`;
}
function quarterCode(dateISO){
  const d=new Date(dateISO+'T12:00:00'); const m=d.getMonth(); const y=d.getFullYear();
  let q, fy;
  if(m>=6 && m<=8){ q=1; fy=y; }
  else if(m>=9 && m<=11){ q=2; fy=y; }
  else if(m>=0 && m<=2){ q=3; fy=y-1; }
  else { q=4; fy=y-1; }
  return {q, fy, label:`Q${q} ${fy}/${String(fy+1).slice(2)}`, start: fy+'-07-01'};
}
