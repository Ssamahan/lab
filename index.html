        const tb = ptList.filter(p=>p.program==='TB'&&p.scorePublished).sort((a,b)=>a.delivered.localeCompare(b.delivered)).map((p,i)=>({x:i,y:p.scorePercent||0}));
        const s = [{label:'HIV %', color:'#0e9f8a', values:hiv},{label:'TB %', color:'#c94c5a', values:tb}].filter(x=>x.values.length);
        return svgLineChart(s, {xLabels: ptList.filter(p=>p.scorePublished).map(p=>p.code||p.delivered.slice(0,7))});
      })()}</div>
      <p class="hint">HIV & TB scored in %, Pass >=80%</p>
    </div>
    <div class="card"><h3> Serology — RPR, HCV — SD Trend</h3>
      <div class="chart-box">${(function(){
        const pts = ptList.filter(p=>p.program==='Serology' && p.scorePublished).sort((a,b)=>a.delivered.localeCompare(b.delivered));
        if(!pts.length) return '<div class="empty">No Serology PT yet — will come soon</div>';
        const analytes = EQA_PROGRAMS.Serology.tests;
        const series = analytes.map((an,i)=>({label:an, color:CHART_COLORS[i%CHART_COLORS.length], values: pts.map((p,idx)=>({x:idx, y: (p.analytes&&p.analytes[an]!=null)?p.analytes[an]:0}))}));
        return svgLineChart(series, {xLabels: pts.map(p=>p.code)});
      })()}</div>
    </div>
  </div>

  <div class="card"><h3> PT Registry — Record Delivery, Testing, Reporting, Scores</h3>
    <div class="toolbar" style="margin-bottom:14px">
      <span class="chip"><b>${ptList.length}</b> PT records</span>
      <span class="chip">Q1 Jul-Sep · Q2 Oct-Dec · Q3 Jan-Mar · Q4 Apr-Jun</span>
      <span class="spacer"></span>
      <button class="btn primary" id="addPT">+ Add PT</button>
      <button class="btn" id="addPTHist"> Add History</button>
    </div>
    ${ptList.length?`<div class="tbl-wrap"><table class="tbl"><tr><th>Quarter Code</th><th>Program</th><th>Delivered</th><th>Tested</th><th>Reported to NRL</th><th>Score Published</th><th>Score</th><th>Overall</th><th>Tests</th><th></th></tr>
    ${ptList.map(p=>`<tr>
      <td><b>${esc(p.code||'—')}</b></td>
      <td><span class="tag blue">${esc(p.program)}</span></td>
      <td>${fmtDate(p.delivered)}</td>
      <td>${p.tested?fmtDate(p.tested):'<span class="hint">—</span>'}</td>
      <td>${p.reported?fmtDate(p.reported):'<span class="hint">—</span>'}</td>
      <td>${p.scorePublished?fmtDate(p.scorePublished):'<span class="hint">pending</span>'}</td>
      <td>${p.scoring==='%'? (p.scorePercent!=null?'<b>'+p.scorePercent+'%</b>':'—') : (p.score!=null?'<b>'+p.score+' SD</b>':'—')}</td>
      <td><span class="tag ${p.overall==='Pass'?'green':p.overall==='Fail'?'red':'amber'}">${esc(p.overall||'Pending')}</span></td>
      <td class="hint">${esc(Object.keys(p.analytes||{}).slice(0,3).join(', ')||'—')}</td>
      <td><button class="btn xs" data-ptedit="${p.id}">Edit</button><button class="btn xs danger" data-ptdel="${p.id}">Del</button></td>
    </tr>`).join('')}</table></div>`:'<div class="empty"><div class="big"></div>No PT records yet — add your first proficiency testing.</div>'}
  </div>
  `;

  document.getElementById('addPT').onclick=()=>openPTForm();
  document.getElementById('addPTHist').onclick=()=>openPTHistoryForm();
  document.querySelectorAll('[data-ptedit]').forEach(b=>b.onclick=()=>openPTForm(b.dataset.ptedit));
  document.querySelectorAll('[data-ptdel]').forEach(b=>b.onclick=()=>{ if(typeof isAdmin==='function' && !isAdmin()) return requireAdmin(); const pt=DB.eqa.find(x=>x.id===b.dataset.ptdel); confirmDlg('Delete PT '+(pt?pt.code+' '+pt.program:b.dataset.ptdel)+'? Confirm deletion.',()=>{ DB.eqa=DB.eqa.filter(x=>x.id!==b.dataset.ptdel); saveDB(); renderEQA(); toast('PT deleted'); }); });
}

function openPTForm(id){
  if(typeof isAdmin==='function' && !isAdmin()) return requireAdmin();
  const p=id?DB.eqa.find(x=>x.id===id):null;
  const programs=Object.keys(EQA_PROGRAMS);
  const q = p? p.code : quarterLabel(todayISO());
  openModal(`<h2>${p?'Edit PT':'Add PT — Proficiency Testing'}</h2>
  <form id="ptForm"><div class="form-grid fg-2">
    <div><label>Quarter Code (e.g. Q2 2026 = Oct-Dec 2026)</label><input id="pt_code" value="${esc((p?p.code:undefined)||q)}" placeholder="Q2 2026" required></div>
    <div><label>Program</label><select id="pt_prog">${programs.map(pr=>`<option ${p&&p.program===pr?'selected':''}>${pr}</option>`).join('')}</select></div>
    <div><label>Delivered to lab (date)</label><input type="date" id="pt_del" value="${(p?p.delivered:undefined)||todayISO()}" required></div>
    <div><label>Tested (date)</label><input type="date" id="pt_tested" value="${(p?p.tested:undefined)||''}"></div>
    <div><label>Reported to NRL (date)</label><input type="date" id="pt_rep" value="${(p?p.reported:undefined)||''}"></div>
    <div><label>Score Published (date)</label><input type="date" id="pt_pub" value="${(p?p.scorePublished:undefined)||''}"></div>
    <div id="pt_scoreWrap"><label>Overall Score (SD or %)</label><input type="number" step="0.1" id="pt_score" value="${(p?p.score:undefined)||''}" placeholder="e.g. 0.8 SD or 95%"><div class="hint">For SD: enter SD value (e.g. 0.5, 1.2). Pass if +-2SD. For %: use % field below.</div></div>
    <div><label>Score % (for HIV & TB)</label><input type="number" id="pt_perc" value="${(p?p.scorePercent:undefined)||''}" placeholder="e.g. 95"></div>
    <div style="grid-column:1/-1"><label>Analytes / Tests (add more as lab elaborates)</label><div id="pt_analytes" class="grid g-3"></div><button type="button" class="btn sm" id="addAnalyte">+ Add test</button></div>
    <div style="grid-column:1/-1"><label>Notes</label><input id="pt_note" value="${esc((p?p.note:undefined)||'')}"></div>
  </div><div class="row" style="margin-top:16px"><button class="btn primary" type="submit">Save PT</button><button class="btn" type="button" onclick="closeModal()">Cancel</button></div></form>`);

  const progSel=document.getElementById('pt_prog');
  const scoreWrap=document.getElementById('pt_scoreWrap');

  function renderAnalytes(){
    const prog = progSel.value;
    const tests = EQA_PROGRAMS[prog] ? EQA_PROGRAMS[prog].tests : [];
    const container=document.getElementById('pt_analytes');
    // Merge existing analytes with program defaults
    const existing = p? (p.analytes||{}) : {};
    const allTests = Array.from(new Set([...tests, ...Object.keys(existing)]));
    container.innerHTML = allTests.map(an=>`<div><label>${esc(an)}</label><input data-an="${esc(an)}" type="number" step="0.1" value="${existing[an]!=null?existing[an]:''}" placeholder="SD or %"></div>`).join('');
  }
  progSel.onchange=renderAnalytes;
  renderAnalytes();

  document.getElementById('addAnalyte').onclick=()=>{
    const name=prompt('Add new test analyte (e.g. HB, CD4, RPR, HCV):'); if(!name) return;
    const prog=progSel.value;
    if(!EQA_PROGRAMS[prog].tests.includes(name)) EQA_PROGRAMS[prog].tests.push(name);
    // Also add to current form
    const container=document.getElementById('pt_analytes');
    const div=document.createElement('div'); div.innerHTML=`<label>${esc(name)}</label><input data-an="${esc(name)}" type="number" step="0.1" placeholder="SD or %">`;
    container.appendChild(div);
  };

  document.getElementById('ptForm').addEventListener('submit',ev=>{
    ev.preventDefault();
    const prog=progSel.value;
    const scoring = EQA_PROGRAMS[prog] ? EQA_PROGRAMS[prog].scoring : 'SD';
    const analytes={};
    document.querySelectorAll('#pt_analytes [data-an]').forEach(inp=>{
      const v=inp.value.trim(); if(v!=='') analytes[inp.dataset.an]=parseFloat(v);
    });
    const scoreVal = parseFloat(document.getElementById('pt_score').value);
    const percVal = parseFloat(document.getElementById('pt_perc').value);
    let overall='Pending';
    if(!isNaN(scoreVal) || !isNaN(percVal)){
      if(scoring==='%'){
        overall = (!isNaN(percVal) && percVal>=80) ? 'Pass' : 'Fail';
      } else {
        // Check each analyte within +-2SD, and overall SD
        const vals = Object.values(analytes);
        const within = vals.length ? vals.every(v=> Math.abs(v) <=2) : (!isNaN(scoreVal) && Math.abs(scoreVal)<=2);
        overall = within ? 'Pass' : 'Fail';
      }
    }
    const data={
      code:document.getElementById('pt_code').value.trim(),
      program:prog,
      scoring,
      delivered:document.getElementById('pt_del').value,
      tested:document.getElementById('pt_tested').value||null,
      reported:document.getElementById('pt_rep').value||null,
      scorePublished:document.getElementById('pt_pub').value||null,
      score: isNaN(scoreVal)?null:scoreVal,
      scorePercent: isNaN(percVal)?null:percVal,
      analytes,
      overall,
      note:document.getElementById('pt_note').value.trim()
    };
    if(p){ Object.assign(p,data); toast('PT updated — '+(overall||'Pending')); }
    else { DB.eqa=DB.eqa||[]; DB.eqa.unshift({id:uid('eqa'),...data}); toast('PT recorded — '+data.code); }
    saveDB(); closeModal(); renderEQA();
  });
}

function openPTHistoryForm(){
  if(typeof isAdmin==='function' && !isAdmin()) return requireAdmin();
  openModal(`<h2> Add History of Previous PT</h2>
  <p class="hint" style="margin-bottom:12px">Paste previous PT scores — e.g. Q1 2024 Hematology 95% Pass, or JSON array. Supports quarters Q1-Q4 (FY starts July).</p>
  <textarea id="pt_hist" rows="12" style="width:100%" placeholder="Q1 2024 | Hematology | WBC:0.5,RBC:0.3,HCT:0.8,MCV:1.1,PLT:0.2,HGB:0.4 | Score:0.6 SD | Pass
Q2 2024 | Biochemistry | Glucose:1.2,Creatinine:0.8,ALT:0.5 | Score:0.9 SD | Pass
Q3 2024 | HIV | Score:95% | Pass"></textarea>
  <div class="row" style="margin-top:12px"><button class="btn primary" id="histSave">Import History</button><button class="btn" onclick="closeModal()">Cancel</button></div>`);
  document.getElementById('histSave').onclick=()=>{
    const raw=document.getElementById('pt_hist').value.trim(); if(!raw) return;
    let count=0;
    raw.split(/\n+/).forEach(line=>{
      const parts=line.split('|').map(s=>s.trim()); if(parts.length<2) return;
      const code=parts[0]; const prog=parts[1];
      if(!EQA_PROGRAMS[prog]) return;
      const analytes={};
      if(parts[2]){
        parts[2].split(',').forEach(pair=>{
          const [k,v]=pair.split(':').map(s=>s.trim()); if(k&&v) analytes[k]=parseFloat(v);
        });
      }
      let score=null, perc=null, overall='Pending';
      if(parts[3]){
        const m=parts[3].match(/([0-9.]+)\s*%/); if(m) perc=parseFloat(m[1]);
        const m2=parts[3].match(/([0-9.-]+)\s*SD/); if(m2) score=parseFloat(m2[1]);
      }
      if(parts[4]) overall=parts[4];
      else {
        if(EQA_PROGRAMS[prog].scoring==='%') overall= perc>=80?'Pass':'Fail';
        else overall= Object.values(analytes).every(v=>Math.abs(v)<=2) ? 'Pass':'Fail';
      }
      DB.eqa=DB.eqa||[];
      if(!DB.eqa.some(x=>x.code===code && x.program===prog)){
        DB.eqa.push({id:uid('eqa'), code, program:prog, scoring:EQA_PROGRAMS[prog].scoring, delivered:code.includes('202')?code.slice(-4)+'-10-01':todayISO(), tested:null, reported:null, scorePublished:todayISO(), score, scorePercent:perc, analytes, overall, note:'Imported history'});
        count++;
      }
    });
    saveDB(); closeModal(); toast(' Imported '+count+' PT history records'); renderEQA();
  };
}





function detectPlatform(){
  try{
    const hasCapacitor = !!(window.Capacitor && typeof window.Capacitor.isNativePlatform==='function' && window.Capacitor.isNativePlatform());
    const platform = (window.Capacitor && window.Capacitor.getPlatform) ? window.Capacitor.getPlatform() : 'web';
    const isFile = window.location.protocol==='file:' || window.location.protocol==='capacitor:';
    const isAPK = hasCapacitor || platform!=='web' || isFile;
    document.body.classList.toggle('is-apk', isAPK);
    document.body.classList.toggle('is-web', !isAPK);
    document.documentElement.style.setProperty('--is-apk', isAPK?'1':'0');
    try{
      if(!isAPK && localStorage.getItem('labSystems.isAPK')){
        localStorage.removeItem('labSystems.isAPK');
      }
    }catch(e){}
    return isAPK;
  }catch(e){
    document.body.classList.add('is-web');
    document.body.classList.remove('is-apk');
    return false;
  }
}



function updateScreenFit(){
  try{
    const w=window.innerWidth, h=window.innerHeight;
    const sw=screen.width, sh=screen.height;
    const dpr=window.devicePixelRatio||1;
    const isMobile = w<=980;
    const tier = (typeof getScreenTier==='function')?getScreenTier():'lg';
    document.documentElement.style.setProperty('--vw', w+'px');
    document.documentElement.style.setProperty('--vh', h+'px');
    document.documentElement.style.setProperty('--dvh', (window.visualViewport?window.visualViewport.height:h)+'px');
    document.documentElement.style.setProperty('--screen-w', sw+'px');
    document.documentElement.style.setProperty('--screen-h', sh+'px');
    const infoEl=document.getElementById('screenFitInfo');
    if(infoEl){
      infoEl.innerHTML=`Viewport: ${w}×${h} (tier ${tier}) • Screen: ${sw}×${sh} • DPR ${dpr} • Mobile ${isMobile?'yes':'no'}<br>Fit: 100dvh + safe-area-inset • Immersive blur`;
    }
    try{
      const main=document.querySelector('main');
      if(main && isMobile){
        main.style.minHeight='calc(100dvh - var(--topbar-h) - env(safe-area-inset-top) - env(safe-area-inset-bottom))';
      }
    }catch(e){}
  }catch(e){ console.warn('updateScreenFit', e.message); }
}


function initBeeperBottom(){
  try{
    const bnav=document.getElementById('bottomNav');
    const handle=document.getElementById('bnavHandle');
    const collapsed=document.getElementById('bnavCollapsed');
    const expanded=document.getElementById('bnavExpanded');
    const moreBtn=document.getElementById('bnavMoreBtn');
    if(!bnav) return;

    const modules = [
      {id:'dash', title:'Dashboard', sub:'Lab Command Center', icon:'<rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>'},
      {id:'roster', title:'Working Plan', sub:'Monthly + Weekly Roster', icon:'<rect x="3" y="4" width="18" height="17" rx="2.5"/><path d="M3 9h18M8 4V2M16 4V2M8 14h4M8 17h4"/>'},
      {id:'eqa', title:'EQA / PT Scores', sub:'Proficiency testing', icon:'<path d="M9 12l2 2 4-4"/><circle cx="12" cy="12" r="10"/>'},
      {id:'samples', title:'Referred Samples', sub:'Register · manifest', icon:'<path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 1.8 3h10.4a2 2 0 0 0 1.8-3l-5-9V3"/>'},
      {id:'stock', title:'Stock & Supplies', sub:'Consumables · batches', icon:'<path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/>'},
      {id:'training', title:'Training Roster', sub:'FIFO queue · history', icon:'<path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/>'},
      {id:'revenue', title:'Training Revenue', sub:'Expenses · balance', icon:'<rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="3"/>'},
      {id:'leave', title:'Leave & Timeline', sub:'Planner · records', icon:'<path d="M4 19l5-5 4 4 7-8"/><path d="M20 6v5h-5"/>'},
      {id:'staff', title:'Staff & Settings', sub:'Registry · data', icon:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/>'}
    ];

    function renderBeeperList(){
      const listEl=document.querySelector('#bnavExpanded .beeper-list');
      if(!listEl) return;
      const curTab = (typeof UI!=='undefined' && UI.tab) ? UI.tab : 'dash';
      listEl.innerHTML = modules.map(m=>{
        const isActive = m.id===curTab;
        const isAdminOnly = (m.id==='revenue'||m.id==='staff');
        const hidden = isAdminOnly && (typeof isViewer==='function' && isViewer()) ? 'style="display:none"' : '';
        return `<div class="beeper-row ${isActive?'active':''}" data-tab="${m.id}" ${hidden}>
          <div class="beeper-ic"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${m.icon}</svg></div>
          <div style="flex:1; min-width:0"><div class="beeper-title">${m.title}</div><div class="beeper-sub">${m.sub}</div></div>
          ${isActive?'<div class="beeper-badge">Active</div>':''}
        </div>`;
      }).join('');
      listEl.querySelectorAll('.beeper-row').forEach(row=>{
        row.onclick=()=>{
          const tab=row.dataset.tab;
          if(tab && typeof setTab==='function'){
            setTab(tab);
            bnav.classList.remove('expanded');
            setTimeout(()=>{ bnav.classList.add('show'); },80);
          }
        };
      });
    }

    renderBeeperList();
    const origSetTab = window.setTab;
    if(origSetTab){
      window.setTab = function(tab,silent){
        const res=origSetTab(tab,silent);
        renderBeeperList();
        return res;
      };
    }

    let state='peek'; // peek (handle visible), collapsed (3 icons), expanded
    function showPeek(){ bnav.classList.remove('show','expanded'); bnav.style.transform='translateY(calc(100% - 32px))'; state='peek'; }
    function showCollapsed(){ bnav.classList.add('show'); bnav.classList.remove('expanded'); bnav.style.transform='translateY(0)'; state='collapsed'; }
    function showExpanded(){ bnav.classList.add('show','expanded'); bnav.style.transform='translateY(0)'; state='expanded'; renderBeeperList(); updateScreenFit(); }
    function hide(){ bnav.classList.remove('show','expanded'); bnav.style.transform='translateY(100%)'; state='hidden'; }

    window.bnavShowCollapsed=showCollapsed;
    window.bnavShowExpanded=showExpanded;
    window.bnavHide=hide;
    window.bnavShowPeek=showPeek;

    // Always show peek handle (32px) so user can swipe anytime
    showPeek();

    // IMPROVED swipe detection - show on EVERY single swipe up
    let touchStartY=0, touchStartX=0, touchStartTime=0, startInBnav=false;
    document.addEventListener('touchstart', e=>{
      if(e.touches.length!==1) return;
      touchStartY=e.touches[0].clientY;
      touchStartX=e.touches[0].clientX;
      touchStartTime=Date.now();
      const bnavRect=bnav.getBoundingClientRect();
      startInBnav = touchStartY >= bnavRect.top && touchStartY <= window.innerHeight;
    }, {passive:true});

    document.addEventListener('touchmove', e=>{
      if(e.touches.length!==1) return;
      const curY=e.touches[0].clientY;
      const dy=touchStartY - curY;
      // If swiping up near bottom or inside bnav, give visual feedback
      if(dy>10 && (window.innerHeight - touchStartY < 220 || startInBnav)){
        if(state==='peek' || state==='hidden'){
          // Pull up to show collapsed
          const pull = Math.min(dy, 120);
          bnav.style.transition='none';
          bnav.style.transform=`translateY(calc(100% - 32px - ${pull}px))`;
        } else if(state==='collapsed' && dy>10){
          const pull = Math.min(dy, 160);
          bnav.style.transition='none';
          bnav.style.transform=`translateY(${-pull*0.4}px)`;
        }
      }
    }, {passive:true});

    document.addEventListener('touchend', e=>{
      if(!e.changedTouches || e.changedTouches.length!==1) return;
      const endY=e.changedTouches[0].clientY;
      const endX=e.changedTouches[0].clientX;
      const dy=touchStartY - endY;
      const dx=Math.abs(touchStartX - endX);
      const dt=Date.now()-touchStartTime;
      bnav.style.transition='';
      // Reset transform before state change
      // Every single swipe up shows navigation
      if(dy>35 && dx<140 && dt<800){
        if(window.innerHeight - touchStartY < 250 || startInBnav || dy>50){
          if(state==='hidden' || state==='peek'){
            showCollapsed();
          } else if(state==='collapsed'){
            showExpanded();
          }
          // Prevent page scroll
          e.preventDefault&&e.preventDefault();
        }
      } else if(dy<-45 && dx<140){
        if(startInBnav){
          if(state==='expanded'){
            showCollapsed();
          } else if(state==='collapsed'){
            showPeek();
          }
        }
      } else {
        // Snap back
        if(state==='peek') showPeek();
        else if(state==='collapsed') showCollapsed();
        else if(state==='expanded') showExpanded();
      }
    }, {passive:false});

    // Handle drag
    let isDragging=false, startY=0, curY=0;
    if(handle){
      handle.addEventListener('touchstart', e=>{ isDragging=true; startY=e.touches[0].clientY; bnav.style.transition='none'; }, {passive:true});
      handle.addEventListener('touchmove', e=>{
        if(!isDragging) return;
        curY=e.touches[0].clientY;
        const dy=startY - curY;
        if(state==='peek' && dy>0){
          bnav.style.transform=`translateY(calc(100% - 32px - ${Math.min(dy,120)}px))`;
        } else if(state==='collapsed' && dy>0){
          bnav.style.transform=`translateY(${-Math.min(dy,160)*0.5}px)`;
        } else if(state==='expanded' && dy<0){
          bnav.style.transform=`translateY(${Math.min(-dy,200)*0.5}px)`;
        } else if(state==='collapsed' && dy<0){
          bnav.style.transform=`translateY(calc(0px + ${Math.min(-dy,100)}px))`;
        }
      }, {passive:true});
      handle.addEventListener('touchend', e=>{
        if(!isDragging) return;
        isDragging=false;
        bnav.style.transition='';
        const dy=startY - curY;
        if(state==='peek' && dy>40) showCollapsed();
        else if(state==='collapsed' && dy>60) showExpanded();
        else if(state==='collapsed' && dy<-40) showPeek();
        else if(state==='expanded' && dy<-60) showCollapsed();
        else {
          if(state==='peek') showPeek();
          else if(state==='collapsed') showCollapsed();
          else if(state==='expanded') showExpanded();
        }
      }, {passive:true});
    }

    if(moreBtn){
      moreBtn.onclick=()=>{
        if(state==='peek' || state==='hidden') showCollapsed();
        else if(state==='collapsed') showExpanded();
        else if(state==='expanded') showCollapsed();
      };
    }

    // Tap handle to toggle
    if(handle){
      handle.onclick=()=>{
        if(state==='peek') showCollapsed();
        else if(state==='collapsed') showExpanded();
        else if(state==='expanded') showCollapsed();
      };
    }

    // Click outside to peek when expanded
    document.addEventListener('click', e=>{
      if(state==='expanded' && !bnav.contains(e.target)){
        showCollapsed();
      }
    });

    // Also show on every swipe up via wheel? For testing on desktop, show on scroll up at bottom
    window.addEventListener('wheel', e=>{
      if(e.deltaY< -30 && window.innerHeight + window.scrollY >= document.body.offsetHeight - 100){
        if(state==='peek' || state==='hidden') showCollapsed();
      }
    }, {passive:true});
  }catch(e){ console.warn('initBeeperBottom', e.message); }
}


// Call on boot
try{ window.addEventListener('load', ()=>{ setTimeout(()=>{ updateScreenFit(); initBeeperBottom(); }, 600); }); }catch(e){}
try{ window.addEventListener('resize', ()=>{ updateScreenFit(); }); }catch(e){}
try{ window.addEventListener('orientationchange', ()=>{ setTimeout(updateScreenFit, 300); }); }catch(e){}


function boot(){
  try{ detectPlatform(); }catch(e){}

  try{ DB=loadDB(); }catch(e){ console.error('loadDB:',e); showBootError('loadDB: '+(e&&e.message||e)); DB=buildSeed(); }
  try{ ensureCurrentPlan(); }catch(e){ console.error('ensureCurrentPlan:',e); showBootError('ensureCurrentPlan: '+(e&&e.message||e)); }
  try{ mergeLeaveTrainings(DB); mergeRevenueTrainings(DB); resolveOverlappingAL(); }catch(e){}
  try{
    // Init EmailJS and Firebase for live data & real email
    try{ if(typeof initEmailJS==='function') initEmailJS(); }catch(e){ console.warn('initEmailJS', e.message); }
    try{ if(typeof initFirebase==='function') initFirebase(); }catch(e){ console.warn('initFirebase', e.message); }
  }catch(e){}
  try{ saveDB(); }catch(e){}
  try{ updateChips(); wireNav(); wireScrollHide(); wireGlobalClicks(); wireAuth(); installAdminGuards(); updateAuthUI(); }catch(e){ console.error('wire:',e); showBootError('setup: '+(e&&e.message||e)); }
  try{ var lb2=document.getElementById('loadedBadge'); if(lb2) lb2.style.display='inline'; }catch(e){}
  // Cloud live load - if Firebase enabled, try to pull newer data
  try{
    if(typeof cloudLoadAndListen==='function'){
      cloudLoadAndListen((didUpdate)=>{
        try{
          if(didUpdate){
            // If cloud had newer data, re-render after boot
            try{ updateChips(); }catch(e){}
            try{ const h=safeHash()||localStorage.getItem('labSystems.lastTab.v1')||'dash'; setTab(RENDER[h]?h:'dash', true); }catch(e){}
          }
        }catch(e){}
      });
    }
  }catch(e){ console.warn('cloudLoad', e.message); }
  // Restore last tab on refresh - fix dashboard reset bug
  let h=safeHash();
  if(!h){ try{ h=localStorage.getItem('labSystems.lastTab.v1')||''; }catch(e){} }
  try{ setTab(RENDER[h]?h:'dash', true); }catch(e){ console.error('setTab:',e); showBootError('dashboard: '+(e&&e.message||e)); }
  try{ var lb=document.getElementById('loadedBadge'); if(lb) lb.style.display='inline'; }catch(e){}
  window.addEventListener('hashchange',()=>{ const t=safeHash(); if(RENDER[t]) setTab(t); });
  finishSplash();
  // Register service worker for PWA + APK
  try{
    if('serviceWorker' in navigator){
      navigator.serviceWorker.register('./sw.js').then(reg=>{
        console.log('SW registered', reg.scope);
      }).catch(e=>{ console.warn('SW register failed', e.message); });
    }
  }catch(e){ console.warn('SW', e.message); }
}
if(document.readyState==='loading'){ document.addEventListener('DOMContentLoaded',boot); }
else { setTimeout(boot,0); }
document.addEventListener('DOMContentLoaded',boot);
