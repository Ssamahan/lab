<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer"><title>Reset staff password · Laboratory</title>
  <link rel="stylesheet" href="assets/css/tokens.css"><link rel="stylesheet" href="assets/css/app.css">
  <style>body{margin:0;padding:24px}main{max-width:520px;margin:auto}label{display:block;margin-top:16px}input:not([type=checkbox]){width:100%;box-sizing:border-box;margin-top:6px}button{margin-top:18px}[hidden]{display:none!important}</style>
</head>
<body><main>
  <h1>Reset your staff password</h1>
  <p>This resets the password for your individual staff account. It does not reset Kelvin’s separate browser-local console password.</p>
  <form id="request-form" novalidate>
    <label for="email">Registered staff email</label>
    <input class="input" id="email" type="email" autocomplete="email" required>
    <button class="btn primary" type="submit">Send reset link</button>
    <p id="request-status" role="status" aria-live="polite" tabindex="-1"></p>
  </form>
  <section id="recovery-section" hidden>
    <h2>Choose a new password</h2>
    <form id="password-form" novalidate>
      <label for="password">New password (at least 12 characters)</label>
      <input class="input" id="password" type="password" autocomplete="new-password">
      <label for="confirmation">Repeat new password</label>
      <input class="input" id="confirmation" type="password" autocomplete="new-password">
      <label><input id="show-password" type="checkbox"> Show passwords</label>
      <button class="btn primary" type="submit">Reset password</button>
      <p id="password-status" role="status" aria-live="polite" tabindex="-1"></p>
    </form>
  </section>
  <div id="success" hidden role="status" tabindex="-1"><h2>Password reset successfully</h2><p>Sign in with your staff email and new password.</p></div>
  <p><a href="staff-catalog.html">Return to staff sign-in</a></p>
</main>
<script src="assets/js/core/shared.js"></script><script src="assets/js/core/staff-password-reset.js"></script>
</body></html>
