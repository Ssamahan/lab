<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
<style>
  .pipette-fill { fill: #ffffff; }
  .pipette-stroke { stroke: #0B1C3D; }
  .pipette-accent { fill: #C9A84C; stroke: #C9A84C; }
  @media (prefers-color-scheme: dark) {
    .pipette-fill { fill: #0B1C3D; }
    .pipette-stroke { stroke: #ffffff; }
    .pipette-accent { fill: #C9A84C; stroke: #C9A84C; }
  }
  .pipette-path { stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
  .pipette-shape { stroke-width: 2.6; stroke-linejoin: round; stroke-linecap: round; }
</style>
<!-- Adaptive background for visibility on both black and white -->
<rect width="128" height="128" rx="24" fill="white" class="bg" style="display:none"/>
<g class="pipette-group">
  <path d="M 49.57 14.65 L 46.75 16.60 L 49.79 27.45 L 43.50 33.52 L 58.47 69.97 L 68.23 80.59 L 81.03 111.18 L 83.63 113.57 L 84.07 109.44 L 73.22 69.10 L 60.64 30.49 L 63.02 25.50 L 70.83 26.80 L 63.67 22.46 L 57.60 23.76 L 54.78 20.94 L 53.26 14.43 Z" class="pipette-fill pipette-shape pipette-stroke" stroke="#0B1C3D" />
  <!-- Yellow accents from original (top plunger + side button) -->
  <path d="M 48.49 38.73 L 46.97 39.81 L 50.23 49.79 L 52.18 48.92 L 48.92 38.95 Z" class="pipette-accent" />
  <path d="M 53.05 14.65 L 52.61 14.22 L 50.88 14.43 L 50.44 14.87 L 49.57 14.87 L 47.62 15.74 L 46.97 16.60 L 47.84 17.25 L 48.06 18.56 L 50.88 17.25 L 53.05 16.82 L 52.61 15.52 Z" class="pipette-accent" />
</g>
<!-- Edge drawing animation version for boot -->
<g fill="none" class="draw-group" style="display:none">
</g>
</svg>
