name: Build APK - Lab Systems v4

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

# Least privilege by default; the build job widens to `contents: write` because
# creating a release is its whole purpose. Nothing else in this repository needs
# the write scope.
permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        # v4 — pinned to the exact commit the tag pointed at when this line was written,
        # the same practice .github/workflows/hiv-timeliness-manual.yml already follows.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node.js
        # v4
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: package.json

      - name: Install Capacitor CLI
        run: |
          npm install
          npx cap --version

      - name: Setup Java 17
        # v4
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        # v4
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd

      - name: Add Android platform (Capacitor)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android || true
          fi
          npx cap copy android || true
          mkdir -p android/app/src/main/res/drawable
          cp -f assets/favicon-192.png android/app/src/main/res/drawable/ic_launcher.png || true
          cp -f assets/favicon-512.png android/app/src/main/res/drawable/ic_launcher_round.png || true

      - name: Make gradlew executable
        run: chmod +x android/gradlew || true

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon -x lint || ./gradlew assembleDebug --no-daemon

      - name: Build Release APK (unsigned)
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon -x lint || true

      - name: Rename APKs
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/Lab-Systems-v4-debug.apk || true
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk dist/Lab-Systems-v4-release-unsigned.apk || true
          ls -lh dist/

      - name: Upload APK Artifact
        # v4
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Lab-Systems-APK
          path: dist/*.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        if: startsWith(github.ref, 'refs/tags/v')
        # v2
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          files: dist/*.apk
          generate_release_notes: true

      - name: Create Latest Release (on main push)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        # v2
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: v4.0-latest
          name: Lab Systems v4.0 - Latest APK
          body: |
            **Ruli District Hospital - Lab Systems v4 (Premium Command Center)**
            - Gold blood drop from micropipette logo
            - Working Plan + Weekly Unit Roster premium exports (Trebuchet MS, centered, gold lines)
            - Dashboard + Training Revenue + EQA/PT Scores premium charts (no overlapping)
            - Admin login + TOTP Authenticator App (real 6-digit codes)
            - Supabase cloud sync (phone ↔ PC), signed-in devices only
            - APK built via Capacitor WebView wrapper loading https://ssamahan.github.io/lab/
            
            **Install:**
            - Download `Lab-Systems-v4-debug.apk` below → allow unknown sources → install
            
            **Live Web:** https://ssamahan.github.io/lab/
          files: dist/*.apk
          prerelease: false
