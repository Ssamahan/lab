# Enable only after the private endpoint and publisher credential are verified.
# Scheduled runs can be delayed by GitHub; they are not real-time.
name: Protected monthly report refresh
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Check and merge in memory without saving'
        type: boolean
        default: true
        required: true
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: read
concurrency:
  group: protected-monthly-report-refresh
  cancel-in-progress: false
jobs:
  refresh:
    if: github.ref == 'refs/heads/main' && ((github.event_name == 'workflow_dispatch' && inputs.dry_run) || vars.REPORT_PUBLISHER_ENABLED == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install pinned reader dependencies
        working-directory: harness
        run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
      - name: Refresh protected history
        env:
          REPORT_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          REPORT_PUBLISHER_SECRET: ${{ secrets.REPORT_PUBLISHER_SECRET }}
          REPORT_DRIVE_SERVICE_ACCOUNT: ${{ secrets.REPORT_DRIVE_SERVICE_ACCOUNT }}
        run: node scripts/report-runner.cjs
